openapi: 3.0.3
info:
  title: ManyForge Mailing Lists and Broadcast Campaigns API
  version: 0.1.0
  description: >
    Incremental Spec 013 contract. Authenticated core CRUD uses bearer permissions; public
    subscriptions use publishable keys and S2S mutations use a purpose-specific HMAC secret.
    Missing permission, invisible business, cross-tenant ID, and unknown ID all return the same
    404 response on authenticated routes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /mailing/public/{key}/subscribe:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string}}
    post:
      operationId: subscribeMailingPublic
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicSubscriptionInput'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/PublicSubscriptionInput'}
      responses:
        '202': {description: Uniform JSON acceptance response}
        '303': {description: Uniform hosted-form redirect}
        '400': {$ref: '#/components/responses/PublicBadRequest'}
        '413': {description: Payload exceeds 64 KiB}
        '429': {description: Ingress or resolved-key rate limit exceeded}
    options:
      operationId: preflightMailingPublicSubscribe
      security: []
      responses: {'204': {description: CORS preflight}}
  /mailing/s2s/{key}/subscribers:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/MailingSignature'}
      - {$ref: '#/components/parameters/MailingTimestamp'}
    post:
      operationId: subscribeMailingS2S
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/S2SSubscriptionInput'}}}
      responses:
        '200': {$ref: '#/components/responses/PublicSubscriber'}
        '201': {$ref: '#/components/responses/PublicSubscriber'}
        '400': {$ref: '#/components/responses/PublicBadRequest'}
        '401': {description: Unknown, revoked, unsigned, or incorrectly signed key}
        '413': {description: Payload exceeds 64 KiB}
        '429': {description: Ingress or resolved-key rate limit exceeded}
  /mailing/s2s/{key}/subscribers/{email}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string}}
      - {name: email, in: path, required: true, schema: {type: string, format: email}}
      - {$ref: '#/components/parameters/MailingSignature'}
      - {$ref: '#/components/parameters/MailingTimestamp'}
    delete:
      operationId: unsubscribeMailingS2S
      security: []
      responses:
        '204': {description: Unsubscribed or already absent}
        '400': {$ref: '#/components/responses/PublicBadRequest'}
        '401': {description: Unknown, revoked, unsigned, or incorrectly signed key}
        '429': {description: Ingress or resolved-key rate limit exceeded}
  /m/confirm/{token}:
    servers: [{url: /}]
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    get:
      operationId: getMailingConfirmationPage
      security: []
      responses: {'200': {description: Uniform confirmation page, content: {text/html: {schema: {type: string}}}}}
    post:
      operationId: confirmMailingSubscription
      security: []
      responses: {'200': {description: Uniform completion page, content: {text/html: {schema: {type: string}}}}}
  /m/u/{token}:
    servers: [{url: /}]
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
    get:
      operationId: getMailingUnsubscribePage
      security: []
      responses: {'200': {description: Uniform unsubscribe page, content: {text/html: {schema: {type: string}}}}}
    post:
      operationId: unsubscribeMailingSubscription
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, properties: {List-Unsubscribe: {type: string, enum: [One-Click]}}}
      responses: {'200': {description: Uniform empty response}}
  /businesses/{id}/mailing/lists:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    get:
      operationId: listMailingLists
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/ListPage'}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      operationId: createMailingList
      requestBody: {$ref: '#/components/requestBodies/ListInput'}
      responses: {'201': {$ref: '#/components/responses/List'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /businesses/{id}/mailing/lists/{lid}:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}]
    get: {operationId: getMailingList, responses: {'200': {$ref: '#/components/responses/List'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch:
      operationId: updateMailingList
      requestBody: {$ref: '#/components/requestBodies/ListPatch'}
      responses: {'200': {$ref: '#/components/responses/List'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
    delete: {operationId: archiveMailingList, responses: {'204': {description: Archived}, '404': {$ref: '#/components/responses/NotFound'}}}
  /businesses/{id}/mailing/lists/{lid}/subscribers:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}]
    get:
      operationId: listMailingSubscribers
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SubscriberStatus'}}
        - {name: tag, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: {'200': {$ref: '#/components/responses/SubscriberPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      operationId: createMailingSubscriber
      requestBody: {$ref: '#/components/requestBodies/SubscriberInput'}
      responses: {'201': {$ref: '#/components/responses/Subscriber'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /businesses/{id}/mailing/lists/{lid}/subscribers/from-contacts:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}]
    post:
      operationId: addMailingSubscribersFromContacts
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContactsImport'}}}}
      responses: {'200': {$ref: '#/components/responses/ImportResult'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
  /businesses/{id}/mailing/lists/{lid}/subscribers/import:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}]
    post:
      operationId: importMailingSubscribersCSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, consent_attested]
              properties:
                file: {type: string, format: binary}
                consent_attested: {type: boolean}
                skip_confirmation: {type: boolean, default: false}
      responses: {'200': {$ref: '#/components/responses/ImportResult'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '413': {description: File exceeds 5 MiB}}
  /businesses/{id}/mailing/lists/{lid}/subscribers/export:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}]
    get:
      operationId: exportMailingSubscribersCSV
      responses: {'200': {description: CSV export, content: {text/csv: {schema: {type: string, format: binary}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /businesses/{id}/mailing/lists/{lid}/subscribers/{sid}:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}, {$ref: '#/components/parameters/SubscriberID'}]
    get: {operationId: getMailingSubscriber, responses: {'200': {$ref: '#/components/responses/Subscriber'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch:
      operationId: updateMailingSubscriber
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriberPatch'}}}}
      responses: {'200': {$ref: '#/components/responses/Subscriber'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
    delete: {operationId: unsubscribeMailingSubscriber, responses: {'204': {description: Unsubscribed}, '404': {$ref: '#/components/responses/NotFound'}}}
  /businesses/{id}/mailing/lists/{lid}/keys:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}]
    get:
      operationId: listMailingListKeys
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/KeyPage'}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      operationId: createMailingListKey
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {label: {type: string, nullable: true, maxLength: 120}}}}}}
      responses: {'201': {description: Secret is returned once, content: {application/json: {schema: {$ref: '#/components/schemas/ListKeyCreated'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /businesses/{id}/mailing/lists/{lid}/keys/{kid}:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/ListID'}, {$ref: '#/components/parameters/KeyID'}]
    delete: {operationId: revokeMailingListKey, responses: {'204': {description: Revoked}, '404': {$ref: '#/components/responses/NotFound'}}}
  /businesses/{id}/mailing/sending-profile:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    get: {operationId: getMailingSendingProfile, responses: {'200': {$ref: '#/components/responses/Profile'}, '404': {$ref: '#/components/responses/NotFound'}}}
    put:
      operationId: putMailingSendingProfile
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SendingProfileInput'}}}}
      responses: {'200': {$ref: '#/components/responses/Profile'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
    delete: {operationId: deleteMailingSendingProfile, responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/NotFound'}}}
  /businesses/{id}/mailing/sending-profile/verify:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    post:
      operationId: verifyMailingSendingProfile
      responses: {'200': {$ref: '#/components/responses/Profile'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /businesses/{id}/mailing/sending-profile/test-send:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    post:
      operationId: testMailingSendingProfile
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TestSendInput'}}}}
      responses: {'204': {description: Test message accepted by the provider}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '429': {description: Outbound rate limit exceeded}, '502': {description: Provider rejected or could not accept the message}}
  /businesses/{id}/mailing/templates:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    get:
      operationId: listMailingTemplates
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/TemplatePage'}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      operationId: createMailingTemplate
      requestBody: {$ref: '#/components/requestBodies/TemplateInput'}
      responses: {'201': {$ref: '#/components/responses/Template'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
  /businesses/{id}/mailing/templates/preview:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    post:
      operationId: previewMailingTemplate
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewInput'}}}}
      responses: {'200': {$ref: '#/components/responses/Preview'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
  /businesses/{id}/mailing/templates/{tid}:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/TemplateID'}]
    get: {operationId: getMailingTemplate, responses: {'200': {$ref: '#/components/responses/Template'}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch:
      operationId: updateMailingTemplate
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplatePatch'}}}}
      responses: {'200': {$ref: '#/components/responses/Template'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
    delete: {operationId: deleteMailingTemplate, responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/NotFound'}}}
  /businesses/{id}/mailing/campaigns/preview:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    post:
      operationId: previewMailingCampaign
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewInput'}}}}
      responses: {'200': {$ref: '#/components/responses/Preview'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}}
  /businesses/{id}/mailing/suppressions:
    parameters: [{$ref: '#/components/parameters/BusinessID'}]
    get:
      operationId: listMailingSuppressions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {$ref: '#/components/responses/SuppressionPage'}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      operationId: createMailingSuppression
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}, reason: {$ref: '#/components/schemas/SuppressionReason'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Suppression'}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /businesses/{id}/mailing/suppressions/{sid}:
    parameters: [{$ref: '#/components/parameters/BusinessID'}, {$ref: '#/components/parameters/SuppressionID'}]
    delete: {operationId: deleteMailingSuppression, responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/NotFound'}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    BusinessID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    ListID: {name: lid, in: path, required: true, schema: {type: string, format: uuid}}
    SubscriberID: {name: sid, in: path, required: true, schema: {type: string, format: uuid}}
    KeyID: {name: kid, in: path, required: true, schema: {type: string, format: uuid}}
    TemplateID: {name: tid, in: path, required: true, schema: {type: string, format: uuid}}
    SuppressionID: {name: sid, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    MailingSignature: {name: X-Mailing-Signature, in: header, required: true, schema: {type: string}, description: Hex HMAC-SHA256 over ts.method.path.body using the mls_ secret.}
    MailingTimestamp: {name: X-Mailing-Timestamp, in: header, required: true, schema: {type: string}, description: Unix seconds within five minutes of server time.}
  requestBodies:
    ListInput: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ListInput'}}}}
    ListPatch: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ListPatch'}}}}
    SubscriberInput: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriberInput'}}}}
    TemplateInput: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateInput'}}}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Unknown, unauthorized, or cross-tenant resource, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Duplicate resource, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    List: {description: Mailing list, content: {application/json: {schema: {$ref: '#/components/schemas/MailingList'}}}}
    Subscriber: {description: Subscriber, content: {application/json: {schema: {$ref: '#/components/schemas/Subscriber'}}}}
    Profile: {description: Sending profile, content: {application/json: {schema: {$ref: '#/components/schemas/SendingProfile'}}}}
    Template: {description: Template, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}
    Suppression: {description: Suppression, content: {application/json: {schema: {$ref: '#/components/schemas/Suppression'}}}}
    ListPage: {description: Lists, content: {application/json: {schema: {$ref: '#/components/schemas/ListPage'}}}}
    SubscriberPage: {description: Subscribers, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriberPage'}}}}
    TemplatePage: {description: Templates, content: {application/json: {schema: {$ref: '#/components/schemas/TemplatePage'}}}}
    SuppressionPage: {description: Suppressions, content: {application/json: {schema: {$ref: '#/components/schemas/SuppressionPage'}}}}
    KeyPage: {description: Keys, content: {application/json: {schema: {$ref: '#/components/schemas/KeyPage'}}}}
    ImportResult: {description: Synchronous import result, content: {application/json: {schema: {$ref: '#/components/schemas/ImportResult'}}}}
    PublicSubscriber: {description: S2S subscriber result, content: {application/json: {schema: {$ref: '#/components/schemas/PublicSubscriber'}}}}
    Preview: {description: Rendered email preview with tracking disabled, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewOutput'}}}}
    PublicBadRequest: {description: Invalid public request, content: {application/json: {schema: {$ref: '#/components/schemas/PublicError'}}}}
  schemas:
    Error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
    SubscriberStatus: {type: string, enum: [pending, active, unsubscribed, bounced, complained]}
    PublicError: {type: object, required: [error], properties: {error: {type: string}}}
    PublicSubscriptionInput: {type: object, required: [email], properties: {email: {type: string, format: email}, first_name: {type: string, nullable: true}, last_name: {type: string, nullable: true}, attributes: {type: object, additionalProperties: true}, website: {type: string, description: Honeypot; non-empty submissions are silently accepted.}}}
    S2SSubscriptionInput: {type: object, required: [email], properties: {email: {type: string, format: email}, first_name: {type: string, nullable: true}, last_name: {type: string, nullable: true}, attributes: {type: object, additionalProperties: true}, skip_confirmation: {type: boolean, default: false}}}
    PublicSubscriber: {type: object, required: [subscriber_id, created, status], properties: {subscriber_id: {type: string, format: uuid}, created: {type: boolean}, status: {$ref: '#/components/schemas/SubscriberStatus'}}}
    SuppressionReason: {type: string, enum: [bounce, complaint, unsubscribe, manual], default: manual}
    MailingList:
      type: object
      required: [id, business_id, tenant_root_id, slug, name, double_opt_in, status, created_at, updated_at]
      properties: {id: {type: string, format: uuid}, business_id: {type: string, format: uuid}, tenant_root_id: {type: string, format: uuid}, slug: {type: string}, name: {type: string}, description: {type: string, nullable: true}, double_opt_in: {type: boolean}, status: {type: string, enum: [active, archived]}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    ListInput: {type: object, required: [name], properties: {slug: {type: string, maxLength: 100}, name: {type: string, maxLength: 200}, description: {type: string, nullable: true}, double_opt_in: {type: boolean, default: true}}}
    ListPatch: {type: object, properties: {name: {type: string, maxLength: 200}, description: {type: string, nullable: true}, double_opt_in: {type: boolean}}}
    Subscriber:
      type: object
      required: [id, business_id, tenant_root_id, list_id, email, attributes, status, consent_source, consent_at, tags, created_at, updated_at]
      properties: {id: {type: string, format: uuid}, business_id: {type: string, format: uuid}, tenant_root_id: {type: string, format: uuid}, list_id: {type: string, format: uuid}, email: {type: string, format: email}, first_name: {type: string, nullable: true}, last_name: {type: string, nullable: true}, attributes: {type: object, additionalProperties: true}, status: {$ref: '#/components/schemas/SubscriberStatus'}, contact_id: {type: string, format: uuid, nullable: true}, consent_source: {type: string, enum: [public_form, api, csv_import, crm, manual]}, consent_attested_by: {type: string, format: uuid, nullable: true}, consent_at: {type: string, format: date-time}, confirmed_at: {type: string, format: date-time, nullable: true}, unsubscribed_at: {type: string, format: date-time, nullable: true}, status_reason: {type: string, nullable: true}, tags: {type: array, maxItems: 50, items: {type: string, maxLength: 64}}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    SubscriberInput: {type: object, required: [email], properties: {email: {type: string, format: email}, first_name: {type: string, nullable: true}, last_name: {type: string, nullable: true}, attributes: {type: object, additionalProperties: true}, tags: {type: array, maxItems: 50, items: {type: string}}, skip_confirmation: {type: boolean, default: false}}}
    SubscriberPatch: {type: object, properties: {first_name: {type: string, nullable: true}, last_name: {type: string, nullable: true}, attributes: {type: object, additionalProperties: true}, tags: {type: array, maxItems: 50, items: {type: string}}, status: {$ref: '#/components/schemas/SubscriberStatus'}, status_reason: {type: string, nullable: true}}}
    ContactsImport: {type: object, required: [contact_ids], properties: {contact_ids: {type: array, minItems: 1, maxItems: 50000, items: {type: string, format: uuid}}, skip_confirmation: {type: boolean, default: false}}}
    ImportResult: {type: object, required: [imported, skipped, errors], properties: {imported: {type: integer, minimum: 0}, skipped: {type: integer, minimum: 0}, errors: {type: array, maxItems: 100, items: {type: object, required: [row, message], properties: {row: {type: integer}, message: {type: string}}}}}}
    ListKey: {type: object, required: [id, business_id, tenant_root_id, list_id, publishable_key, status, has_secret, created_at], properties: {id: {type: string, format: uuid}, business_id: {type: string, format: uuid}, tenant_root_id: {type: string, format: uuid}, list_id: {type: string, format: uuid}, publishable_key: {type: string}, label: {type: string, nullable: true}, status: {type: string, enum: [enabled, revoked]}, has_secret: {type: boolean}, created_at: {type: string, format: date-time}, revoked_at: {type: string, format: date-time, nullable: true}}}
    ListKeyCreated: {description: Create-only response; plaintext secret is returned once and never appears on read paths., allOf: [{$ref: '#/components/schemas/ListKey'}, {type: object, properties: {secret: {type: string, description: Plaintext mls_ signing secret returned once at creation.}}}]}
    SendingProfile:
      type: object
      required: [id, business_id, tenant_root_id, mode, from_email, from_name, status, has_credentials, created_at, updated_at]
      properties: {id: {type: string, format: uuid}, business_id: {type: string, format: uuid}, tenant_root_id: {type: string, format: uuid}, mode: {type: string, enum: [relay, resend, ses]}, from_email: {type: string, format: email}, from_name: {type: string}, reply_to: {type: string, format: email, nullable: true}, postal_address: {type: string, nullable: true}, email_domain_id: {type: string, format: uuid, nullable: true}, ses_region: {type: string, nullable: true}, ses_configuration_set: {type: string, nullable: true}, sns_topic_arn: {type: string, nullable: true}, status: {type: string, enum: [unverified, verified, error]}, last_verified_at: {type: string, format: date-time, nullable: true}, verify_error: {type: string, nullable: true}, has_credentials: {type: boolean}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}
    SendingProfileInput: {type: object, required: [mode, from_email, from_name], properties: {mode: {type: string, enum: [relay, resend, ses]}, from_email: {type: string, format: email}, from_name: {type: string}, reply_to: {type: string, format: email, nullable: true}, postal_address: {type: string, nullable: true}, email_domain_id: {type: string, format: uuid, nullable: true}, resend: {type: object, properties: {api_key: {type: string, writeOnly: true}, webhook_secret: {type: string, writeOnly: true}}}, ses: {type: object, properties: {access_key_id: {type: string, writeOnly: true}, secret_access_key: {type: string, writeOnly: true}}}, ses_region: {type: string}, ses_configuration_set: {type: string}, sns_topic_arn: {type: string}}}
