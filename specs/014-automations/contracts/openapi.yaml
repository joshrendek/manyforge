openapi: 3.0.3
info:
  title: ManyForge Branching Drip Automations API
  version: 0.1.0
  description: |
    Incremental contract for Spec 014. Backend slices add complete automation,
    version, validation, lifecycle, enrollment, event, and statistics paths here
    before implementation. The canonical endpoint inventory is in section 6.7
    of the mailing-lists and automations design.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /businesses/{id}/mailing/automations:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    get:
      operationId: listAutomations
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Automation page, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationPage'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createAutomation
      requestBody: {$ref: '#/components/requestBodies/AutomationCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
  /businesses/{id}/mailing/automations/{aid}:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    get:
      operationId: getAutomation
      responses:
        '200': {description: Automation, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateAutomation
      requestBody: {$ref: '#/components/requestBodies/AutomationUpdate'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/versions:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    get:
      operationId: listAutomationVersions
      responses:
        '200': {description: Versions, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AutomationVersion'}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createAutomationDraftVersion
      responses:
        '201': {description: Active graph cloned into a draft, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationVersion'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/versions/{vid}:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
      - $ref: '#/components/parameters/VersionID'
    get:
      operationId: getAutomationVersion
      responses:
        '200': {description: Version including graph, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationVersion'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /businesses/{id}/mailing/automations/{aid}/versions/{vid}/graph:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
      - $ref: '#/components/parameters/VersionID'
    put:
      operationId: replaceAutomationGraph
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Graph'}}}
      responses:
        '200': {description: Saved draft, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationVersion'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/versions/{vid}/validate:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
      - $ref: '#/components/parameters/VersionID'
    post:
      operationId: validateAutomationVersion
      responses:
        '200': {description: Validation result, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationResult'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /businesses/{id}/mailing/automations/{aid}/versions/{vid}/activate:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
      - $ref: '#/components/parameters/VersionID'
    post:
      operationId: activateAutomationVersion
      responses:
        '200': {description: Activated, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AutomationInvalid'}
  /businesses/{id}/mailing/automations/{aid}/pause:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    post:
      operationId: pauseAutomation
      responses:
        '200': {description: Paused, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/resume:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    post:
      operationId: resumeAutomation
      responses:
        '200': {description: Resumed, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/archive:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    post:
      operationId: archiveAutomation
      responses:
        '200': {description: Archived, content: {application/json: {schema: {$ref: '#/components/schemas/Automation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/enrollments:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    get:
      operationId: listAutomationEnrollments
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [active, completed, exited, errored]}}
        - {name: node_id, in: query, schema: {type: string, pattern: '^[a-z0-9_-]{1,64}$'}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Enrollment page, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentPage'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: enrollAutomationSubscriber
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [subscriber_id], properties: {subscriber_id: {type: string, format: uuid}}}}}
      responses:
        '201': {description: Enrolled, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/enrollments/{eid}:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
      - $ref: '#/components/parameters/EnrollmentID'
    get:
      operationId: getAutomationEnrollment
      responses:
        '200': {description: Enrollment and step timeline, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /businesses/{id}/mailing/automations/{aid}/enrollments/{eid}/exit:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
      - $ref: '#/components/parameters/EnrollmentID'
    post:
      operationId: exitAutomationEnrollment
      responses:
        '200': {description: Exited, content: {application/json: {schema: {$ref: '#/components/schemas/Enrollment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /businesses/{id}/mailing/automations/{aid}/stats:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - $ref: '#/components/parameters/AutomationID'
    get:
      operationId: getAutomationStats
      parameters:
        - {name: version_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Enrollment and per-node statistics, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationStats'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
  /businesses/{id}/mailing/events:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    post:
      operationId: createAutomationEvent
      requestBody: {$ref: '#/components/requestBodies/AutomationEvent'}
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationEvent'}}}}
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationEvent'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '404': {$ref: '#/components/responses/NotFound'}
  /mailing/s2s/{key}/events:
    parameters:
      - $ref: '#/components/parameters/MailingKey'
      - $ref: '#/components/parameters/MailingTimestamp'
      - $ref: '#/components/parameters/MailingSignature'
    post:
      security: []
      operationId: createAutomationEventS2S
      requestBody: {$ref: '#/components/requestBodies/AutomationEvent'}
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationEvent'}}}}
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationEvent'}}}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {description: Invalid key or signature}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {description: Key rate limit exceeded}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BusinessID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    AutomationID: {name: aid, in: path, required: true, schema: {type: string, format: uuid}}
    VersionID: {name: vid, in: path, required: true, schema: {type: string, format: uuid}}
    EnrollmentID: {name: eid, in: path, required: true, schema: {type: string, format: uuid}}
    MailingKey: {name: key, in: path, required: true, schema: {type: string}}
    MailingTimestamp: {name: X-Mailing-Timestamp, in: header, required: true, schema: {type: string}}
    MailingSignature: {name: X-Mailing-Signature, in: header, required: true, schema: {type: string}}
  requestBodies:
    AutomationCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              description: {type: string, nullable: true, maxLength: 5000}
              allow_reenroll: {type: boolean, default: false}
    AutomationUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              description: {type: string, nullable: true, maxLength: 5000}
              allow_reenroll: {type: boolean}
    AutomationEvent:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 128}
              email: {type: string, format: email, description: Exactly one of email or subscriber_id is required.}
              subscriber_id: {type: string, format: uuid}
              occurred_at: {type: string, format: date-time}
              idempotency_key: {type: string, minLength: 1, maxLength: 200}
              properties: {type: object, additionalProperties: true}
  schemas:
    Automation:
      type: object
      required: [id, business_id, tenant_root_id, name, status, allow_reenroll, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        tenant_root_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, nullable: true}
        status: {type: string, enum: [draft, active, paused, archived]}
        allow_reenroll: {type: boolean}
        active_version_id: {type: string, format: uuid, nullable: true}
        draft_version_id: {type: string, format: uuid, nullable: true}
        created_by_principal_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AutomationPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Automation'}}
        next_cursor: {type: string, nullable: true}
    Enrollment:
      type: object
      required: [id, business_id, tenant_root_id, automation_id, version_id, subscriber_id, status, node_attempts, enrolled_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        tenant_root_id: {type: string, format: uuid}
        automation_id: {type: string, format: uuid}
        version_id: {type: string, format: uuid}
        subscriber_id: {type: string, format: uuid}
        status: {type: string, enum: [active, completed, exited, errored]}
        current_node_id: {type: string, nullable: true}
        wake_at: {type: string, format: date-time, nullable: true}
        node_attempts: {type: integer}
        last_error: {type: string, nullable: true}
        exit_reason: {type: string, nullable: true}
        source_event_id: {type: string, format: uuid, nullable: true}
        enrolled_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        updated_at: {type: string, format: date-time}
    EnrollmentPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Enrollment'}}
        next_cursor: {type: string, nullable: true}
    EnrollmentStep:
      type: object
      required: [id, node_id, node_kind, attempt, entered_at, outcome, detail]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: string}
        node_kind: {type: string}
        attempt: {type: integer}
        entered_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}
        outcome: {type: string, enum: [entered, waiting, advanced, sent, branch_yes, branch_no, exited, error]}
        delivery_id: {type: string, format: uuid, nullable: true}
        detail: {type: object, additionalProperties: true}
    EnrollmentDetail:
      type: object
      required: [enrollment, steps]
      properties:
        enrollment: {$ref: '#/components/schemas/Enrollment'}
        steps: {type: array, items: {$ref: '#/components/schemas/EnrollmentStep'}}
    AutomationEvent:
      type: object
      required: [id, business_id, name, email, occurred_at, properties, created_at, created]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        subscriber_id: {type: string, format: uuid, nullable: true}
        occurred_at: {type: string, format: date-time}
        idempotency_key: {type: string, nullable: true}
        properties: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        created: {type: boolean}
    NodeStats:
      type: object
      required: [node_id, node_kind, entered, waiting, advanced, sent, branch_yes, branch_no, exited, errors]
      properties:
        node_id: {type: string}
        node_kind: {type: string}
        entered: {type: integer, format: int64}
        waiting: {type: integer, format: int64}
        advanced: {type: integer, format: int64}
        sent: {type: integer, format: int64}
        branch_yes: {type: integer, format: int64}
        branch_no: {type: integer, format: int64}
        exited: {type: integer, format: int64}
        errors: {type: integer, format: int64}
    AutomationStats:
      type: object
      required: [automation_id, version_id, enrollments, nodes]
      properties:
        automation_id: {type: string, format: uuid}
        version_id: {type: string, format: uuid}
        enrollments:
          type: object
          required: [active, completed, exited, errored]
          properties:
            active: {type: integer, format: int64}
            completed: {type: integer, format: int64}
            exited: {type: integer, format: int64}
            errored: {type: integer, format: int64}
        nodes: {type: array, items: {$ref: '#/components/schemas/NodeStats'}}
    AutomationVersion:
      type: object
      required: [id, business_id, tenant_root_id, automation_id, number, status, graph, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        tenant_root_id: {type: string, format: uuid}
        automation_id: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, active, superseded]}
        graph: {$ref: '#/components/schemas/Graph'}
        trigger_kind: {type: string, nullable: true, enum: [list_joined, tag_added, event]}
        trigger_ref: {type: string, nullable: true}
        activated_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/Node'}
        edges:
          type: array
          items: {$ref: '#/components/schemas/Edge'}
    Node:
      oneOf:
        - $ref: '#/components/schemas/TriggerNode'
        - $ref: '#/components/schemas/SendEmailNode'
        - $ref: '#/components/schemas/WaitNode'
        - $ref: '#/components/schemas/ConditionNode'
        - $ref: '#/components/schemas/AddTagNode'
        - $ref: '#/components/schemas/RemoveTagNode'
        - $ref: '#/components/schemas/ExitNode'
      discriminator:
        propertyName: kind
        mapping:
          trigger: '#/components/schemas/TriggerNode'
          send_email: '#/components/schemas/SendEmailNode'
          wait: '#/components/schemas/WaitNode'
          condition: '#/components/schemas/ConditionNode'
          add_tag: '#/components/schemas/AddTagNode'
          remove_tag: '#/components/schemas/RemoveTagNode'
          exit: '#/components/schemas/ExitNode'
    NodeBase:
      type: object
      required: [id, kind, config]
      properties:
        id: {type: string, pattern: '^[a-z0-9_-]{1,64}$'}
        kind: {type: string}
        name: {type: string, maxLength: 200}
        config: {type: object}
    TriggerNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [trigger]}
            config: {$ref: '#/components/schemas/TriggerConfig'}
    SendEmailNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [send_email]}
            config: {$ref: '#/components/schemas/SendEmailConfig'}
    WaitNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [wait]}
            config: {$ref: '#/components/schemas/WaitConfig'}
    ConditionNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [condition]}
            config: {$ref: '#/components/schemas/ConditionConfig'}
    AddTagNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [add_tag]}
            config: {$ref: '#/components/schemas/TagConfig'}
    RemoveTagNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [remove_tag]}
            config: {$ref: '#/components/schemas/TagConfig'}
    ExitNode:
      allOf:
        - $ref: '#/components/schemas/NodeBase'
        - type: object
          properties:
            kind: {type: string, enum: [exit]}
            config: {$ref: '#/components/schemas/ExitConfig'}
    TriggerConfig:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, list_id]
          properties:
            type: {type: string, enum: [list_joined]}
            list_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [type, tag, list_id]
          properties:
            type: {type: string, enum: [tag_added]}
            tag: {type: string, minLength: 1, maxLength: 64, pattern: '.*\S.*'}
            list_id: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [type, name, list_id]
          properties:
            type: {type: string, enum: [event]}
            name: {type: string, minLength: 1, maxLength: 128, pattern: '.*\S.*'}
            list_id: {type: string, format: uuid}
    SendEmailConfig:
      type: object
      additionalProperties: false
      required: [template_id, track_opens, track_clicks]
      properties:
        template_id: {type: string, format: uuid}
        track_opens: {type: boolean}
        track_clicks: {type: boolean}
    WaitConfig:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, seconds]
          properties:
            mode: {type: string, enum: [duration]}
            seconds: {type: integer, minimum: 60, maximum: 31536000}
        - type: object
          additionalProperties: false
          required: [mode, time, timezone]
          properties:
            mode: {type: string, enum: [until]}
            weekday: {type: integer, minimum: 1, maximum: 7, nullable: true}
            time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
            timezone: {type: string, minLength: 1, description: IANA timezone name}
    ConditionConfig:
      type: object
      additionalProperties: false
      required: [predicate]
      properties:
        predicate:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, node_id]
              properties:
                type: {type: string, enum: [opened_email]}
                node_id: {type: string, pattern: '^[a-z0-9_-]{1,64}$'}
            - type: object
              additionalProperties: false
              required: [type, node_id]
              properties:
                type: {type: string, enum: [clicked_link]}
                node_id: {type: string, pattern: '^[a-z0-9_-]{1,64}$'}
                url: {type: string, format: uri, pattern: '^https?://', nullable: true}
            - type: object
              additionalProperties: false
              required: [type, tag]
              properties:
                type: {type: string, enum: [has_tag]}
                tag: {type: string, minLength: 1, maxLength: 64, pattern: '.*\S.*'}
            - type: object
              additionalProperties: false
              required: [type, list_id]
              properties:
                type: {type: string, enum: [on_list]}
                list_id: {type: string, format: uuid}
            - type: object
              additionalProperties: false
              required: [type, name]
              properties:
                type: {type: string, enum: [event_received]}
                name: {type: string, minLength: 1, maxLength: 128, pattern: '.*\S.*'}
                within_seconds: {type: integer, minimum: 1, maximum: 31536000, nullable: true}
    TagConfig:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag: {type: string, minLength: 1, maxLength: 64, pattern: '.*\S.*'}
    ExitConfig:
      type: object
      additionalProperties: false
      maxProperties: 0
    Edge:
      type: object
      required: [id, from, to, branch]
      properties:
        id: {type: string, pattern: '^[a-z0-9_-]{1,64}$'}
        from: {type: string}
        to: {type: string}
        branch:
          type: string
          enum: ['yes', 'no']
          nullable: true
          description: Required as yes/no for condition edges and null for every other edge.
    Issue:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        node_id: {type: string}
        edge_id: {type: string}
        message: {type: string}
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: {type: boolean}
        issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    AutomationInvalid:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [issues]
          properties:
            code: {type: string, enum: [AUTOMATION_INVALID]}
            issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
  responses:
    Validation: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Lifecycle conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AutomationInvalid: {description: Graph validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationInvalid'}}}}
