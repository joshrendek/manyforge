openapi: 3.0.3
info:
  title: manyforge — web analytics (manyforge-as0)
  version: "1.2.0"
  description: |
    Privacy-first web analytics for tenant sites, built on the manyforge-p20 storage foundation.

    Three surfaces:

    * **The embed** — `GET /a.js`, a dependency-free snippet a tenant pastes into their site.
    * **Collect** — `POST /a/e`, the principal-less beacon endpoint the snippet calls.
    * **Read** — `GET /api/v1/businesses/{id}/analytics/summary`, the authenticated dashboard API,
      gated by `telemetry.read`.

    The embed and collect endpoints are mounted at the ROOT, not under `/api/v1`: an embed tag is
    pasted into a site and forgotten, so its URL must stay stable across API versioning.

    ## Privacy model

    No cookies, no persistent identifier, no cross-site profile. A visitor is counted as
    `sha256(daily_salt ‖ client_id ‖ ip ‖ user_agent)`, truncated. Raw IP and User-Agent are
    hashed in the same statement that inserts the row and are never stored or logged. The salt
    rotates daily and is deleted once past retention, so an aged-out hash cannot be re-derived
    even with full database access.

    Consequence worth stating plainly: because the salt rotates daily, **unique visitors is a
    per-day measure**. There is deliberately no cross-day identifier, so a multi-day "unique
    visitors" total cannot be computed and is not reported as one.

servers:
  # The embed and collect endpoints live at the root; the read API lives under /api/v1.
  - url: https://hub.bluescripts.net
    description: Root origin — serves /a.js and /a/e
  - url: https://hub.bluescripts.net/api/v1
    description: Versioned API — serves the analytics summary

paths:
  /a.js:
    get:
      summary: The embeddable analytics snippet
      description: |
        Dependency-free tracker. Embedded as:

        ```html
        <script defer src="https://hub.bluescripts.net/a.js" data-key="mfk_..."></script>
        ```

        Reads `data-key` from its own script tag, and optionally `data-host` to override the
        collect origin. Sends a pageview on load, on `history.pushState`, and on `popstate`;
        `replaceState` is deliberately not tracked because SPAs use it for query-string rewrites
        that are not pageviews. Repeated identical paths are suppressed.

        Skips entirely when `doNotTrack` is set, on `file:` origins, and on localhost.

        No Subresource Integrity is advertised: pinning a hash would break every embedding site
        on each snippet update. A tenant wanting SRI can self-host the file, which is static and
        dependency-free.
      operationId: getAnalyticsSnippet
      security: []
      responses:
        '200':
          description: The snippet
          content:
            application/javascript:
              schema: { type: string }
        '304':
          description: Not modified

  /a/e:
    post:
      summary: Collect one pageview (public, principal-less)
      description: |
        Called by the snippet, normally via `navigator.sendBeacon`.

        **Always returns 204**, whatever happens — unknown key, revoked key, malformed body,
        disallowed/missing Origin, or a bot. A public collect endpoint must not confirm which keys
        exist, and a beacon has no
        error handling to receive a status, so a varying status would leak information to an
        attacker while telling a legitimate site nothing. Operators observe health through the
        `analytics.collected` / `analytics.collect_rejected` metrics instead. Origin mismatches
        also increment the unlabeled `analytics.origin_rejected` counter without logging the key
        or origin.

        A configured exact Origin allowlist is a data-integrity guard against accidental key reuse
        and routine browser pollution. Origin is caller-controlled and spoofable outside a browser,
        so it is explicitly not authentication. The endpoint accepts no cookies or credentials.

        The server derives `occurred_at` from its own clock and the visitor hash from the request
        IP and User-Agent. Neither the IP nor the UA is stored. The path is stripped of its query
        string and fragment before storage, because query strings routinely carry session tokens
        and email addresses.
      operationId: collectAnalyticsEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [k, p]
              properties:
                k: { type: string, description: 'The publishable `mfk_` site key.' }
                p: { type: string, description: 'Path only. Query string and fragment are stripped server-side.' }
                r: { type: string, description: 'Referrer HOST only. A full URL is reduced to its host server-side.' }
                n:
                  type: string
                  maxLength: 64
                  description: |
                    Custom event name. Omitted (the usual case) means an automatic pageview.
                    Restricted to `[A-Za-z0-9_:.-]` and **`pageview` is reserved** — accepting it
                    here would let a site inflate its own pageview count through the event API and
                    disagree with the pageview rollup every other panel reconciles against.
                    A malformed name drops the event rather than being coerced.
                d:
                  type: object
                  additionalProperties: true
                  description: |
                    Custom event properties. The collector retains only scalar values whose exact
                    event/property pair is configured through the authenticated property-rule API.
                    Unknown keys, nested values, and arrays are dropped. Sensitive-data, secret,
                    network-identifier, and persistent-identifier key names are prohibited in both
                    the management API and database boundary. Values are capped at 128 characters.
                q:
                  type: string
                  description: |
                    ONLY the `utm_source`, `utm_medium`, and `utm_campaign` parameters, as a query
                    fragment. This is NOT the page's query string: forwarding that would ship
                    session tokens and email addresses from the tenant's own site to this
                    endpoint. The snippet extracts the three keys by name and the server re-filters
                    with the same allowlist, since the endpoint is public.
      responses:
        '204':
          description: Always. Success and every failure mode are indistinguishable by design.

    options:
      summary: CORS preflight for the collect endpoint
      description: |
        The snippet's beacon posts `text/plain`, which is a CORS-"simple" content type and needs
        no preflight. This exists for the XHR fallback used when `sendBeacon` is unavailable: that
        path sets `Content-Type: application/json`, which is not simple and therefore preflights.
        Without this route those browsers would collect nothing.

        Returns a wildcard `Access-Control-Allow-Origin`. That is correct rather than lax here —
        the endpoint exists to be called from arbitrary tenant sites, accepts no cookies or
        Authorization header, and returns no data, so a wildcard grants a caller nothing they
        could not do with curl. Credentials are deliberately not allowed.
      operationId: collectAnalyticsPreflight
      security: []
      responses:
        '204':
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin:
              schema: { type: string }
            Access-Control-Allow-Methods:
              schema: { type: string }
            Access-Control-Allow-Headers:
              schema: { type: string }
            Access-Control-Max-Age:
              schema: { type: string }

  # Served under the /api/v1 prefix (see servers). Declared unprefixed to match the
  # repo convention that the OpenAPI-drift walker compares against.
  /businesses/{id}/analytics/summary:
    get:
      summary: Dashboard aggregates for one site
      description: |
        Requires `telemetry.read`. Reads exclusively from rollup tables, never raw events, so
        response time does not grow with traffic volume.

        `visitors` is the **peak daily** unique-visitor count across the window, not a sum and not
        a deduplicated total — see the privacy model. `average_daily_visitors` is the arithmetic
        mean of those daily counts, including zero-traffic days. `direct_pageviews` is derived as
        total pageviews minus attributed referrer pageviews.

        The daily series contains exactly one ordered UTC point per requested calendar day for
        every supported range (up to 366 days). The comparison is the immediately preceding
        inclusive window with the same number of days.
      operationId: getAnalyticsSummary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: client_id
          in: query
          required: true
          description: The analytics site (telemetry client) to report on.
          schema: { type: string, format: uuid }
        - name: days
          in: query
          required: false
          description: Window length in days, ending today (UTC). Capped at 366.
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSummary' }
        '400':
          description: Invalid day range
        '401':
          description: Missing or invalid credentials
        '404':
          description: |
            Unknown site, a site belonging to another business, a malformed site id, or a caller
            lacking `telemetry.read`. All four are the same response — the distinctions would be
            existence oracles.

  /businesses/{id}/analytics/sites/{clientID}/property-rules:
    get:
      summary: List the custom-event properties retained for one site
      description: |
        Requires `telemetry.read`. Unknown, foreign, revoked, malformed, and unauthorized sites
        are indistinguishable. Rule IDs and `enabled_at` remain stable across label-only updates.
      operationId: listAnalyticsPropertyRules
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The complete ordered property-rule set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsPropertyRulesResponse' }
        '400': { description: Malformed business id }
        '401': { description: Missing or invalid credentials }
        '404': { description: Site unavailable to this caller }
    put:
      summary: Replace the custom-event property retention allowlist
      description: |
        Requires `telemetry.write`. This is a complete replacement, including an empty list to
        clear retention. At most 20 rules are allowed per site and six per event. Event/key pairs
        must be unique. Direct identifiers, secrets, network identifiers, and persistent IDs are
        prohibited. Enabling a rule is not retroactive: older raw JSON is neither restored nor
        aggregated, and any pre-governance raw properties age out with the 90-day event retention.
      operationId: replaceAnalyticsPropertyRules
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: clientID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  maxItems: 20
                  items: { $ref: '#/components/schemas/AnalyticsPropertyRuleInput' }
      responses:
        '200':
          description: The complete saved property-rule set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsPropertyRulesResponse' }
        '400': { description: Malformed business id, body, or unsafe/invalid rule set }
        '401': { description: Missing or invalid credentials }
        '404': { description: Site unavailable to this caller }

  /analytics/overview:
    get:
      summary: Every analytics site the caller can see, across all their businesses
      description: |
        The multi-site landing page (Plausible-style grid). Takes **no business id**: it spans every
        business the caller belongs to, which is the point — sub-businesses are visible together
        rather than one dropdown selection at a time.

        Authorization differs in FORM but not in strength from the per-site route. The business
        -scoped endpoints are gated by middleware that resolves `telemetry.read` for the one business
        in the path; that cannot express "every business where the caller holds this permission", so
        here the same rule is applied in SQL via `businesses_with_permission()`. A business the
        caller can *see* but lacks `telemetry.read` on is omitted — matching what the per-site
        dashboard would do if they opened it directly.

        Sites with no traffic yet are returned with zeroed totals and a complete zero-filled daily
        series rather than omitted: a newly tagged site that vanished from this list would read as
        a broken tag.

        Reads exclusively from rollup tables, never raw events. The site list is capped at 200,
        ordered by average daily visitors descending (ties broken by pageviews, then name, so the
        order is stable across requests), so the cap sheds the quietest sites.

        Note the ordering metric and the headline metric are deliberately the same. Ordering by
        pageviews or peak visitors while presenting average daily visitors would make the cap drop
        sites that rank highly by the number actually shown on the card.

        `data_as_of` is the minimum completed watermark shared by the pageview, standard-dimension,
        and governed-property rollups. It is null until all three have completed, so no panel
        implies that slower sibling data is fresher than it is. The watermark is global processing
        state and contains no tenant data.
      operationId: getAnalyticsOverview
      parameters:
        - name: days
          in: query
          required: false
          description: Window length in days, ending today (UTC). Capped at 366.
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        '200':
          description: |
            Sites the caller may read. An empty list means no sites, no permission, or no
            memberships — deliberately indistinguishable.
          content:
            application/json:
              schema:
                type: object
                required: [sites, data_as_of]
                properties:
                  data_as_of:
                    type: string
                    format: date-time
                    nullable: true
                  sites:
                    type: array
                    items: { $ref: '#/components/schemas/AnalyticsOverviewSite' }
        '400':
          description: Invalid day range
        '401':
          description: Missing or invalid credentials

components:
  schemas:
    AnalyticsPropertyRuleInput:
      type: object
      additionalProperties: false
      required: [event_name, property_key, label]
      properties:
        event_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_:.-]+$'
        property_key:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[A-Za-z0-9_:.-]+$'
          description: Must not identify a person, device, account, session, network address, or secret.
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: Human-readable reporting purpose displayed to the operator.
    AnalyticsPropertyRule:
      type: object
      additionalProperties: false
      required: [id, event_name, property_key, label, enabled_at]
      properties:
        id: { type: string, format: uuid }
        event_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_:.-]+$'
        property_key:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[A-Za-z0-9_:.-]+$'
        label: { type: string, minLength: 1, maxLength: 64 }
        enabled_at:
          type: string
          format: date-time
          description: Stable non-retroactive activation boundary for this exact event/key pair.
    AnalyticsPropertyRulesResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AnalyticsPropertyRule' }
    AnalyticsOverviewSite:
      type: object
      required: [client_id, name, business_id, business_name, pageviews, visitors, average_daily_visitors, series]
      properties:
        client_id:     { type: string, format: uuid }
        name:          { type: string }
        business_id:   { type: string, format: uuid }
        business_name: { type: string }
        pageviews:     { type: integer, format: int64 }
        visitors:
          type: integer
          format: int64
          description: |
            Peak DAILY unique visitors in the window — the SAME definition the per-site summary
            uses, so a card and the dashboard it opens agree. Not a sum and not a cross-day total:
            the daily salt rotation makes cross-day deduplication impossible by design.
        average_daily_visitors:
          type: number
          format: double
          description: Mean daily unique visitors across every requested day, including zeroes.
        series:
          type: array
          description: One ordered UTC point for every requested calendar day, including zeroes.
          items:
            type: object
            required: [date, pageviews, visitors]
            properties:
              date:      { type: string, format: date }
              pageviews: { type: integer, format: int64 }
              visitors:  { type: integer, format: int64 }
    AnalyticsSummary:
      type: object
      required: [from, to, data_as_of, pageviews, visitors, average_daily_visitors, series, top_pages, top_referrers, direct_pageviews, direct_share, comparison, breakdowns, property_breakdowns]
      properties:
        from: { type: string, format: date }
        to:   { type: string, format: date }
        data_as_of:
          type: string
          format: date-time
          nullable: true
          description: |
            Minimum completed watermark shared by the pageview, standard-dimension, and governed-
            property rollups. Null until all three have completed. This global processing
            timestamp contains no tenant data.
        pageviews: { type: integer, format: int64 }
        visitors:
          type: integer
          format: int64
          description: Peak DAILY unique visitors in the window. Not a sum; not a cross-day total.
        average_daily_visitors:
          type: number
          format: double
          description: Mean daily unique visitors across every requested day, including zeroes.
        direct_pageviews:
          type: integer
          format: int64
          description: Pageviews with no referrer, derived as total minus attributed referrers.
        direct_share:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Direct pageviews as a percentage of all pageviews in the current window.
        comparison:
          $ref: '#/components/schemas/AnalyticsSummaryComparison'
        series:
          type: array
          description: One ordered UTC point for every requested calendar day, including zeroes.
          items:
            type: object
            required: [date, pageviews, visitors]
            properties:
              date:      { type: string, format: date }
              pageviews: { type: integer, format: int64 }
              visitors:  { type: integer, format: int64 }
        top_pages:
          type: array
          items:
            type: object
            required: [path, pageviews, visitors]
            properties:
              path:      { type: string }
              pageviews: { type: integer, format: int64 }
              visitors:  { type: integer, format: int64 }
        top_referrers:
          type: array
          items:
            type: object
            required: [host, pageviews, visitors]
            properties:
              host:      { type: string }
              pageviews: { type: integer, format: int64 }
              visitors:  { type: integer, format: int64 }
        breakdowns:
          type: object
          description: |
            Per-dimension breakdowns keyed by `event`, `utm_source`, `utm_medium`,
            `utm_campaign`, `device`, `browser`, `country`.

            `event` counts CUSTOM events only; the others are derived from pageviews only, so they
            stay reconcilable against the pageview total rather than mixing two denominators. Every tracked dimension is present even when empty,
            so a client can distinguish "nothing collected yet" from "not a dimension we track".

            All values are deliberately LOW CARDINALITY — `device` is three buckets, `browser` is
            a family name, `country` is ISO alpha-2. The identifying inputs they derive from (the
            User-Agent and the IP) are never stored. Finer granularity would reintroduce the
            fingerprint the whole design exists to avoid.

            `country` is empty unless the deployment explicitly trusts Cloudflare's
            `CF-IPCountry` signal (`MANYFORGE_TRUST_CF_IPCOUNTRY=true`). Header trust must be
            enabled only when the origin cannot be bypassed; the Helm chart enforces a Cloudflare
            source-CIDR allowlist and ingress-controller-only NetworkPolicy when enabled. An
            absent breakdown is reported rather than a guessed one.
          additionalProperties:
            type: array
            items:
              type: object
              required: [value, pageviews, visitors]
              properties:
                value:     { type: string }
                pageviews: { type: integer, format: int64 }
                visitors:  { type: integer, format: int64 }
        property_breakdowns:
          type: array
          description: |
            Active governed event/property rules and their bounded aggregate values. The API reads
            these from daily rollups only. `events` counts matching custom events; `visitors` is
            the peak daily visitor count because visitor hashes intentionally rotate each day.
            A configured rule may be present with an empty `values` array. Values before the
            rule's activation boundary are never aggregated retroactively.
          items:
            type: object
            additionalProperties: false
            required: [rule_id, event_name, property_key, label, values]
            properties:
              rule_id: { type: string, format: uuid }
              event_name: { type: string }
              property_key: { type: string }
              label: { type: string }
              values:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [value, events, visitors]
                  properties:
                    value: { type: string }
                    events: { type: integer, format: int64 }
                    visitors:
                      type: integer
                      format: int64
                      description: Peak daily visitors for this value in the selected window.
    AnalyticsSummaryComparison:
      type: object
      required: [from, to, pageviews, average_daily_visitors, direct_pageviews, direct_share, pageviews_change_percent, average_daily_visitors_change_percent, direct_share_change_percentage_points]
      description: The immediately preceding inclusive window with the same number of calendar days.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        pageviews: { type: integer, format: int64 }
        average_daily_visitors: { type: number, format: double }
        direct_pageviews: { type: integer, format: int64 }
        direct_share:
          type: number
          format: double
          minimum: 0
          maximum: 100
        pageviews_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous pageview count is zero.
        average_daily_visitors_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous average is zero.
        direct_share_change_percentage_points:
          type: number
          format: double
          description: Current direct share minus previous direct share, in percentage points.
