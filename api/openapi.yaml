  /api/v1/connectors/{type}/{connectorID}/webhook:
    post:
      operationId: ConnectorsWebhookReceive
      summary: Receive an inbound connector webhook
      security: []
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Discoverability segment only; the stored connector type selects the verifier.
      - name: connectorID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Hub-Signature
        in: header
        schema:
          type: string
        description: 'Jira: sha256=<hex> HMAC-SHA256 of raw body with stored webhook secret.'
      - name: X-Zendesk-Webhook-Signature
        in: header
        schema:
          type: string
        description: 'Zendesk: base64 HMAC-SHA256 of timestamp concatenated with raw body.'
      - name: X-Zendesk-Webhook-Signature-Timestamp
        in: header
        schema:
          type: string
      description: Inbound callback, not a management action. Provider-specific signatures are verified with the
        stored connector secret, not bearer authentication. Empty 202 covers accepted/replayed, unknown/disabled
        connector, malformed payload and internal failures; missing/bad signature on a known connector returns 401.
        Body limit is 2 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorWebhookEvent'
      responses:
        '202':
          description: Accepted or ignored; empty body.
        '401':
          description: Missing or invalid provider signature on a known connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload exceeds 2 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-manyforge-audience: callback
      x-manyforge-resource: connectors.webhook
      tags:
      - ConnectorsWebhook
      x-manyforge-method: receive
