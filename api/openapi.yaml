# Sole editable live contract. SDK projection and language sources are generated from this file.
openapi: 3.0.3
info:
  title: ManyForge API
  version: 1.0.0
  description: Current implemented ManyForge application API. Configure an explicit instance-root URL. Management
    uses bearer access JWTs; public keys and server signatures have separate capabilities. Optional modules remain
    documented when disabled; their unavailable routes return real HTTP errors. Errors may be non-JSON at an intermediary;
    empty 202/204 responses contain no model. No SSE interface is implemented.
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/inbound/email/{provider}:
    parameters:
    - $ref: '#/components/parameters/provider'
    post:
      tags:
      - InboxInboundEmail
      summary: Receive an inbound email provider callback
      security: []
      parameters:
      - name: X-MF-Signature
        in: header
        required: true
        description: Hex HMAC-SHA256 over raw body bytes, optionally with sha256= prefix. When X-MF-Timestamp is
          non-empty, sign timestamp + "." + body. Missing/invalid signature returns 401. No timestamp skew window
          is enforced.
        schema:
          type: string
      - name: X-MF-Timestamp
        in: header
        required: false
        description: Optional timestamp string bound into the HMAC as timestamp + "." + body. No timestamp skew
          window is enforced.
        schema:
          type: string
      requestBody:
        required: true
        description: Normalized provider JSON or raw RFC822 bytes. Enforced inbound byte limit returns 413; decoder
          failures return 400.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEmailEnvelope'
          message/rfc822:
            schema:
              type: string
              format: binary
              description: Raw RFC822 message bytes (SMTP-style providers).
      responses:
        '202':
          description: 'Accepted for ingestion. Returned uniformly whether the recipient routed to a business, was
            an unknown/unroutable address (dropped, no data written), or was a duplicate Message-ID (no-op) — so
            the response never distinguishes these cases (FR-003/FR-005/SC-006).

            '
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/SupportCRMError401'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/SupportCRMRateLimited'
        default:
          description: Unexpected HTTP error. Intermediaries may return non-JSON bodies; preserve the actual status,
            headers and bounded raw body.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '400':
          description: Invalid request body, unknown provider, malformed JSON envelope or invalid base64 raw_mime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '500':
          description: Inbound ingestion failed; details are not disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
      x-manyforge-audience: callback
      x-manyforge-resource: inbox.inboundEmail
      x-manyforge-method: ingest
      operationId: InboxInboundEmailIngest
      description: HMAC-SHA256 authenticates the raw body, optionally prefixed by X-MF-Timestamp and a dot. All
        six provider keys share the normalized JSON/raw RFC822 decoder. Routed, duplicate and unknown recipients
        receive the same empty 202. Only the first JSON to address, or the first parsed To/Cc address for raw MIME,
        is used for routing.
  /api/v1/inbound/bounce:
    post:
      tags:
      - InboxBounces
      summary: Receive a provider bounce callback
      security: []
      parameters:
      - name: X-MF-Signature
        in: header
        required: true
        description: Hex HMAC-SHA256 over raw body bytes, optionally with sha256= prefix. When X-MF-Timestamp is
          non-empty, sign timestamp + "." + body. Missing/invalid signature returns 401. No timestamp skew window
          is enforced.
        schema:
          type: string
      - name: X-MF-Timestamp
        in: header
        required: false
        description: Optional timestamp string bound into the HMAC as timestamp + "." + body. No timestamp skew
          window is enforced.
        schema:
          type: string
      requestBody:
        required: true
        description: Normalized hard-bounce notification. Capped at the server's inbound body limit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BounceBody'
      responses:
        '202':
          description: Empty acknowledgment for accepted or ignored notifications, including capped/aborted body
            reads. Does not disclose recipient or message existence.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/SupportCRMError401'
        default:
          description: Unexpected HTTP error. Intermediaries may return non-JSON bodies; preserve the actual status,
            headers and bounded raw body.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '503':
          description: Empty response when the suppression transaction fails.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '429':
          description: Per-IP ingress rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
      x-manyforge-audience: callback
      x-manyforge-resource: inbox.bounces
      x-manyforge-method: ingest
      operationId: InboxBouncesIngest
      description: Uses a purpose-separated bounce HMAC-SHA256 secret. Body-read failures, including the configured
        inbound cap, return empty 202 before signature verification. After successful signature verification, malformed
        payloads, soft bounces and missing recipients are acknowledged with empty 202. Case-insensitive hard bounces
        suppress a non-empty recipient and optionally mark the matching outbound message failed. Suppression failures
        return empty 503.
  /api/v1/businesses/{id}/tickets:
    parameters:
    - $ref: '#/components/parameters/id'
    get:
      tags:
      - Tickets
      summary: 'List tickets for a business and its authorized descendants (FR-015). Keyset-paginated, server-capped
        page size (FR-020). 404 if the business is unknown/unauthorized (no oracle). Requires tickets.read.

        '
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TicketStatus'
      - name: priority
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TicketPriority'
      - name: assignee
        in: query
        required: false
        description: Filter by assignee principal id. Use the literal `unassigned` to list tickets with no assignee.
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: Filter to tickets carrying this tag (exact match).
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: 'Case-insensitive literal subject substring, combined with all other filters on every cursor
          page. Leading/trailing whitespace is trimmed; empty or whitespace-only matches all subjects. Percent and
          underscore are literal characters, not wildcards. At most 256 Unicode characters after trimming; longer
          searches return 400.

          '
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          $ref: '#/components/responses/TicketPage'
        '400':
          description: Invalid cursor or filter value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '404':
          $ref: '#/components/responses/SupportCRMNotFound'
        '401':
          description: Missing or invalid bearer access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '503':
          description: Tenant maintenance is in progress; request cannot proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        default:
          description: Unexpected HTTP error. Intermediaries may return non-JSON bodies; preserve the actual status,
            headers and bounded raw body.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
      x-manyforge-audience: management
      x-manyforge-resource: tickets
      x-manyforge-method: list
      operationId: TicketsList
      x-manyforge-business-param: id
      x-manyforge-pagination:
        cursor: cursor
        limit: limit
        items: items
        next: next_cursor
  /api/v1/businesses/{id}/tickets/{tid}:
    parameters:
    - $ref: '#/components/parameters/id'
    - $ref: '#/components/parameters/tid'
    get:
      tags:
      - Tickets
      summary: Get a ticket (FR-015). 404 if unknown OR unauthorized (no oracle). Requires tickets.read.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ok
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '404':
          $ref: '#/components/responses/SupportCRMNotFound'
        '401':
          description: Missing or invalid bearer access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
