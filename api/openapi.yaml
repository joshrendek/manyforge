  /api/v1/telemetry/ingest/{key}:
    options:
      operationId: TelemetryPreflight
      summary: Check telemetry browser access without resolving the client key
      description: Only POST is allowed as the requested method. Preflight bypasses per-IP and per-key ingest limits and never resolves the key.
      security: []
      tags: [Telemetry]
      x-manyforge-audience: browser
      x-manyforge-resource: telemetry
      x-manyforge-method: preflight
      parameters:
      - $ref: '#/components/parameters/PublicIngestKey'
      - $ref: '#/components/parameters/CORSOrigin'
      - $ref: '#/components/parameters/CORSRequestMethod'
      - $ref: '#/components/parameters/CORSRequestHeaders'
      responses:
        '204':
          $ref: '#/components/responses/PublicIngestPreflightAllowed'
        '403':
          $ref: '#/components/responses/PublicIngestCORSDenied'
    post:
      summary: Ingest a batch of telemetry events (public, principal-less)
      description: 'Authenticated by the publishable `mfk_` key in the path — no JWT. Rate-limited per IP

        and per key. Bodies are capped at 256 KiB and batches at 1000 events.


        The target table is chosen from the client''s REGISTERED kind, not from the request body:

        posting `crash` events with an `analytics` key stores nothing. Tenant scope likewise

        comes from the resolved key, so `tenant_root_id` / `business_id` in a body are ignored.


        `occurred_at` is client-supplied and untrusted. Timestamps more than 5 minutes in the

        future are clamped to now; events older than 7 days (or with no timestamp) are dropped

        individually and counted in `dropped`, so one stale event never discards a good batch.

        It never influences storage placement — partitioning is keyed on server ingest time.

        '
      operationId: ingestTelemetry
      security: []
      parameters:
      - name: key
        in: path
        required: true
        description: The publishable `mfk_` client key.
        schema:
          type: string
      - name: X-Telemetry-Signature
        in: header
        required: false
        description: t=<unix>,v1=<hex HMAC-SHA256> over timestamp.METHOD.fullRequestTarget.body using the entire
          mfs_ secret. Target includes /api/v1 and exact raw query; sign exactly the transmitted JSON bytes. Timestamp
          must be within 300 seconds. Required only for require_signature clients. Optional signatures are verified
          when a secret exists; a signature on an unsigned key with no secret is ignored.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
      responses:
        '403':
          $ref: '#/components/responses/PublicIngestCORSDenied'
        '202':
          description: Processing completed; accepted counts persisted events, dropped counts individually invalid/stale
            events for the registered kind. A 202 may contain partial acceptance or both counters zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryIngestResult'
        '400':
          description: Malformed JSON body, or a batch over the 1000-event limit (rejected, never truncated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '401':
          description: 'Unknown, revoked, or malformed key, or a missing/invalid signature on a client that

            requires one. The response is byte-identical across all of these cases.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '413':
          description: Body exceeded the 256 KiB cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        '429':
          description: Per-IP or per-key rate limit exceeded; no automatic retry is implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataError'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicError'
        default:
          description: Unexpected HTTP response, including a non-JSON proxy or transport error. Preserve status,
            headers, request ID and bounded raw body; do not infer the Error envelope.
      x-manyforge-signing: telemetry
      x-manyforge-audience: public
      x-manyforge-resource: telemetry
      x-manyforge-method: ingest
      tags:
      - Telemetry
