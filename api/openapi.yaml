  /api/v1/github/webhook:
    post:
      operationId: githubWebhook
      parameters:
      - name: X-Hub-Signature-256
        in: header
        schema:
          type: string
        description: sha256=<hex> HMAC-SHA256 of the raw request body with the GitHub App webhook secret. Required
          for processing on a configured instance.
      - name: X-GitHub-Event
        in: header
        schema:
          type: string
        description: installation and pull_request are processed; other or absent event types are acknowledged and
          ignored.
      - name: X-GitHub-Delivery
        in: header
        schema:
          type: string
        description: GitHub delivery identity used for deduplication.
      - name: X-GitHub-Hook-Installation-Target-ID
        in: header
        schema:
          type: string
        description: When present, must equal the configured App ID as a decimal string; a mismatch is acknowledged
          and ignored.
      summary: Receive GitHub App webhook deliveries
      description: Inbound GitHub callback. Verifies X-Hub-Signature-256 with the configured GitHub App webhook
        secret; processes installation lifecycle events and eligible pull_request events. Other events, malformed/filtered
        payloads, unconfigured instances and replays return empty 202. Signature failures return empty 401; oversized/read-failed
        bodies return empty 413. No bearer authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubWebhookEvent'
      responses:
        '202':
          description: Delivery accepted (processed or ignored)
        '401':
          description: Missing or invalid webhook signature
        '413':
          description: Request body exceeds the webhook size cap
      x-manyforge-audience: callback
      x-manyforge-resource: githubApp.webhook
      tags:
      - GithubAppWebhook
      x-manyforge-method: receive
      security: []
