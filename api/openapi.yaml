          type: string
        detail:
          $ref: '#/components/schemas/ZendeskWebhookDetail'
      required:
      - detail
    ZendeskWebhookDetail:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
      required:
      - id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
