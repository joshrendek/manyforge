          type: string
          description: openai_codex only, empty for every other provider. The ChatGPT subscription plan reported
            by the last successful token refresh (e.g. "plus", "pro"). Omitted when unavailable; not returned as
            null or an empty string.
        connection_status:
          type: string
          enum:
          - connected
          - disconnected
          description: openai_codex only, empty for every other provider. "connected" when a usable token exists
            (sealed API key or OAuth refresh token); "disconnected" otherwise. Never returns the api key — this
            is a derived status, not the secret itself. Omitted when unavailable; not returned as null or an empty
            string.
        oauth_access_expiry:
          type: string
          description: openai_codex only, empty for every other provider. Expiry of the last-minted OAuth access
            token. Omitted when unavailable; not returned as null or an empty string.
