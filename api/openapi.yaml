    AnalyticsBreakdowns:
      type: object
      description: 'Per-dimension breakdowns keyed by `event`, `utm_source`, `utm_medium`,

        `utm_campaign`, `device`, `browser`, `country`.


        `event` counts CUSTOM events only; the others are derived from pageviews only, so they

        stay reconcilable against the pageview total rather than mixing two denominators. Every tracked dimension
        is present even when empty,

        so a client can distinguish "nothing collected yet" from "not a dimension we track".


        All values are deliberately LOW CARDINALITY — `device` is three buckets, `browser` is

        a family name, `country` is ISO alpha-2. The identifying inputs they derive from (the

        User-Agent and the IP) are never stored. Finer granularity would reintroduce the

        fingerprint the whole design exists to avoid.


        `country` is empty unless the deployment explicitly trusts Cloudflare''s

        `CF-IPCountry` signal (`MANYFORGE_TRUST_CF_IPCOUNTRY=true`). Header trust must be

        enabled only when the origin cannot be bypassed; the Helm chart enforces a Cloudflare

        source-CIDR allowlist and ingress-controller-only NetworkPolicy when enabled. An

        absent breakdown is reported rather than a guessed one.

        '
      properties:
        utm_source:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
        utm_medium:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
        utm_campaign:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
        device:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
        browser:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
        country:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
        event:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsValueCount'
      required:
      - utm_source
      - utm_medium
      - utm_campaign
      - device
      - browser
      - country
      - event
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/AnalyticsValueCount'
    AnalyticsCollectRequest:
      type: object
      required:
      - k
      properties:
        k:
          type: string
          description: The publishable `mfk_` site key.
        p:
          type: string
          description: Path only; omitted/empty normalizes to /. Query and fragment are stripped.
        r:
          type: string
          description: Referrer HOST only. A full URL is reduced to its host server-side.
        n:
          type: string
          maxLength: 64
          description: 'Custom event name. Omitted (the usual case) means an automatic pageview.

            Restricted to `[A-Za-z0-9_:.-]` and **`pageview` is reserved** — accepting it

            here would let a site inflate its own pageview count through the event API and

            disagree with the pageview rollup every other panel reconciles against.

            A malformed name drops the event rather than being coerced.

            '
        d:
          type: object
          additionalProperties: true
          description: 'Custom event properties. The collector retains only scalar values whose exact

            event/property pair is configured through the authenticated property-rule API.

            Unknown keys, nested values, and arrays are dropped. Sensitive-data, secret,

            network-identifier, and persistent-identifier key names are prohibited in both

            the management API and database boundary. Values are capped at 128 characters.

            '
          nullable: true
        q:
          type: string
          description: 'ONLY the `utm_source`, `utm_medium`, and `utm_campaign` parameters, as a query

            fragment. This is NOT the page''s query string: forwarding that would ship

            session tokens and email addresses from the tenant''s own site to this

            endpoint. The snippet extracts the three keys by name and the server re-filters

            with the same allowlist, since the endpoint is public.

            '
    AnalyticsDayPoint:
      type: object
      required:
      - date
      - pageviews
      - visitors
      properties:
        date:
          type: string
          format: date
        pageviews:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
    AnalyticsEvent:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
        name:
          type: string
        props:
          description: Arbitrary JSON event properties; scalars, arrays, objects and null are accepted.
      description: Missing required-for-storage fields or a missing/stale occurred_at drop this event and increment
        dropped; they do not reject the whole batch. Invalid timestamp syntax rejects the request.
    AnalyticsHostCount:
      type: object
      required:
