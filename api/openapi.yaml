        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
        description: Capped list, not cursor pagination. Runtime clamps values to 1–100.
      - name: voter_identity
        in: query
        required: false
        description: Opaque identity to resolve "viewer_voted" against (server-namespaced a:/v:)
        schema:
          type: string
      - name: author
        in: query
        required: false
        description: Opaque identity to filter results to that author's posts
        schema:
          type: string
      - name: X-Feedback-Signature
        in: header
        required: false
        description: Optional t=<unix>,v1=<hex HMAC-SHA256> over timestamp.METHOD.fullRequestTarget.body using the
          entire fbs_ secret. Target includes /api/v1 and the exact raw query; GET uses an empty body. Timestamp
          must be within 300 seconds. No signature is anonymous. A header on a key without a secret remains anonymous;
          a bad signature on a key with a secret returns uniform 401.
        schema:
          type: string
      responses:
        '403':
          $ref: '#/components/responses/PublicIngestCORSDenied'
        '200':
          description: Top public posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPostList'
        '401':
          description: Unknown/revoked publishable key or non-public board (uniform, no oracle)
