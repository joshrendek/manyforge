    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: startCodexPKCEConnect
      summary: Begin the OpenAI Codex "Sign in with ChatGPT" (PKCE paste-redirect) connect flow
      description: Generates a PKCE verifier/challenge and stores a pending connection record. Open authorize_url,
        then submit the resulting redirect URL to the exchange endpoint. ChatGPT authentication has no device-authorization
        grant. This route is conditionally mounted when the Codex connect service is configured; an unmounted route
        returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodexConnectRequest'
      responses:
        '200':
          description: PKCE flow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexPKCEStart'
        '400':
          $ref: '#/components/responses/AgentsValidationError'
        '404':
          $ref: '#/components/responses/AgentsNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected HTTP response; intermediaries may return a non-JSON body.
        '413':
          description: JSON request body exceeds the 1 MiB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-manyforge-audience: management
      x-manyforge-resource: aiCredentials.codex.pkce
      x-manyforge-method: start
      x-manyforge-business-param: id
      tags:
      - AiCredentialsCodexPkce
  /api/v1/businesses/{id}/ai_credentials/codex/pkce/exchange:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: exchangeCodexPKCEConnect
      summary: Complete the OpenAI Codex PKCE connect flow
      description: "Parses the pasted redirect URL, validates state == pending_id, exchanges the code with auth.openai.com,\
        \ and — on success — seals and persists the resulting openai_codex credential, consuming the pending row\
