          - vllm
          - openrouter
          - huggingface
          - openai_codex
        base_url:
          type: string
        default_model:
          type: string
        allow_private_base_url:
          type: boolean
        max_concurrent_lanes:
          type: integer
          minimum: 1
          maximum: 16
