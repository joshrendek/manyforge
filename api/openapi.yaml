          format: double
        direct_pageviews:
          type: integer
          format: int64
        direct_share:
          type: number
          format: double
          minimum: 0
          maximum: 100
        pageviews_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous pageview count is zero.
        average_daily_visitors_change_percent:
          type: number
          format: double
          nullable: true
          description: Null when the previous average is zero.
        direct_share_change_percentage_points:
          type: number
          format: double
          description: Current direct share minus previous direct share, in percentage points.
