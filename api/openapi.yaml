          description: Peak daily visitors for this value in the selected window.
    AnalyticsSiteHealth:
      type: object
      required:
      - status
      - receiving_data
      - last_accepted_at
      - activity_data_as_of
      - data_as_of
      properties:
        status:
          type: string
          enum:
          - checking
          - never_seen
          - healthy
          - stale
          - revoked
          description: '`checking` means the activity rollup has not completed recently enough to make a

            per-site claim. `never_seen` means it completed and found no accepted event. `healthy`

            means an event was accepted within 24 hours; `stale` means earlier activity exists but

            no exact event was accepted in that window. `revoked` means collection is disabled.

            '
        receiving_data:
          type: boolean
          description: True only when an accepted event arrived within the last 24 hours.
        last_accepted_at:
          type: string
          format: date-time
          nullable: true
          description: Server ingest time of the latest compacted event; null before any exact observation.
        activity_data_as_of:
          type: string
          format: date-time
          nullable: true
          description: Watermark through which the installation-health rollup has checked activity.
        data_as_of:
          type: string
          format: date-time
          nullable: true
          description: Common completed watermark of the analytics rollups that feed dashboards.
    AnalyticsSummary:
      type: object
      required:
      - from
      - to
      - data_as_of
      - pageviews
      - visitors
      - average_daily_visitors
      - series
      - top_pages
      - top_referrers
      - direct_pageviews
      - direct_share
      - comparison
      - breakdowns
      - property_breakdowns
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        data_as_of:
          type: string
          format: date-time
          nullable: true
          description: 'Minimum completed watermark shared by the pageview, standard-dimension, and governed-

            property rollups. Null until all three have completed. This global processing

            timestamp contains no tenant data.

            '
        pageviews:
          type: integer
          format: int64
        visitors:
          type: integer
          format: int64
          description: Peak DAILY unique visitors in the window. Not a sum; not a cross-day total.
        average_daily_visitors:
          type: number
          format: double
          description: Mean daily unique visitors across every requested day, including zeroes.
        direct_pageviews:
          type: integer
          format: int64
          description: Pageviews with no referrer, derived as total minus attributed referrers.
        direct_share:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Direct pageviews as a percentage of all pageviews in the current window.
        comparison:
          $ref: '#/components/schemas/AnalyticsSummaryComparison'
        series:
          type: array
          description: One ordered UTC point for every requested calendar day, including zeroes.
          items:
            $ref: '#/components/schemas/AnalyticsDayPoint'
        top_pages:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsPathCount'
        top_referrers:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsHostCount'
        breakdowns:
          $ref: '#/components/schemas/AnalyticsBreakdowns'
        property_breakdowns:
          type: array
          description: 'Active governed event/property rules and their bounded aggregate values. The API reads

            these from daily rollups only. `events` counts matching custom events; `visitors` is

            the peak daily visitor count because visitor hashes intentionally rotate each day.

            A configured rule may be present with an empty `values` array. Values before the

            rule''s activation boundary are never aggregated retroactively.

            '
          items:
            $ref: '#/components/schemas/AnalyticsPropertyBreakdown'
    AnalyticsSummaryComparison:
      type: object
      required:
      - from
      - to
      - pageviews
      - average_daily_visitors
      - direct_pageviews
      - direct_share
      - pageviews_change_percent
      - average_daily_visitors_change_percent
      - direct_share_change_percentage_points
