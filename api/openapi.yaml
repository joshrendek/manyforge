    options:
      summary: CORS preflight for the collect endpoint
      description: 'The snippet''s beacon posts `text/plain`, which is a CORS-"simple" content type and needs

        no preflight. This exists for the XHR fallback used when `sendBeacon` is unavailable: that

        path sets `Content-Type: application/json`, which is not simple and therefore preflights.

        Without this route those browsers would collect nothing.


        Returns a wildcard `Access-Control-Allow-Origin`. That is correct rather than lax here —

        the endpoint exists to be called from arbitrary tenant sites, accepts no cookies or

