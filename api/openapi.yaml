    - $ref: '#/components/parameters/tid'
    post:
      tags:
      - Tickets
      summary: 'Send an outbound reply to the requester (FR-008). The reply is delivered as a threaded email (In-Reply-To/References
        + a system reply token) from the verified custom identity if present, else the always-available system address
        (FR-013), and is recorded as an outbound TicketMessage. Audited in-transaction (FR-014). Requires tickets.reply.
        404 if unknown/unauthorized.

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
          description: outbound message recorded
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/SupportCRMValidationError'
        '404':
          $ref: '#/components/responses/SupportCRMNotFound'
        '409':
