      responses:
        '204':
          $ref: '#/components/responses/PublicIngestPreflightAllowed'
        '403':
          $ref: '#/components/responses/PublicIngestCORSDenied'
    get:
      summary: (Public SDK/portal) List public posts for a board by publishable key
      operationId: publicListFeedbackPosts
      tags:
      - Posts
