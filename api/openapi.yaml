      x-manyforge-resource: tickets
      x-manyforge-method: get
      operationId: TicketsGet
      x-manyforge-business-param: id
    patch:
      tags:
      - Tickets
      summary: Update ticket status, priority, tags or assignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicket'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ok
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/SupportCRMValidationError'
        '404':
          $ref: '#/components/responses/SupportCRMNotFound'
        '409':
          $ref: '#/components/responses/SupportCRMConflict'
        '401':
          description: Missing or invalid bearer access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '503':
          description: Tenant maintenance is in progress; request cannot proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '413':
          description: JSON request body exceeds the 1 MiB handler limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        default:
          description: Unexpected HTTP error. Intermediaries may return non-JSON bodies; preserve the actual status,
            headers and bounded raw body.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
      x-manyforge-audience: management
      x-manyforge-resource: tickets
      x-manyforge-method: update
      operationId: TicketsUpdate
      x-manyforge-business-param: id
      description: 'Requires tickets.write. Partial update. Omitted fields preserve their values. Null status, priority,
        or tags also preserve their values. An empty tags array clears all tags. Assignee has three distinct states:
        omitted preserves, null unassigns, UUID assigns; any present assignee field requires tickets.assign.'
    delete:
      tags:
      - Tickets
      summary: 'Redact (soft-delete in place) a ticket (FR-014, research R7). Blanks the subject, every message
        body, and every attachment filename; stamps redacted_at (excluding the ticket from get/list/ messages);
        purges attachment blobs out-of-band via the outbox; audited in-transaction with scope metadata only (counts,
        no PII). NEVER a hard delete (Principle VI). Idempotent — a second redact, an unknown id, or a foreign-tenant
        id all return the same no-oracle 404. Requires tickets.delete.

        '
      responses:
        '204':
          description: Redacted (soft-deleted in place); no content.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '404':
          $ref: '#/components/responses/SupportCRMNotFound'
        '401':
          description: Missing or invalid bearer access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        '503':
          description: Tenant maintenance is in progress; request cannot proceed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
        default:
          description: Unexpected HTTP error. Intermediaries may return non-JSON bodies; preserve the actual status,
            headers and bounded raw body.
          headers:
            X-Request-Id:
              description: Request correlation identifier when available.
              schema:
                type: string
      x-manyforge-audience: management
      x-manyforge-resource: tickets
      x-manyforge-method: delete
      operationId: TicketsDelete
      x-manyforge-business-param: id
  /api/v1/businesses/{id}/tickets/{tid}/reply:
