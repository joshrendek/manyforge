          type: integer
          format: int32
    WaitConfig:
      oneOf:
      - $ref: '#/components/schemas/DurationWaitConfig'
      - $ref: '#/components/schemas/UntilWaitConfig'
      discriminator:
        propertyName: mode
        mapping:
          duration: '#/components/schemas/DurationWaitConfig'
          until: '#/components/schemas/UntilWaitConfig'
    WaitNode:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
        kind:
          type: string
          enum:
          - wait
        name:
          type: string
          maxLength: 200
        config:
          $ref: '#/components/schemas/WaitConfig'
      required:
      - id
      - kind
      - config
    ZendeskConnectorWebhook:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
