      properties:
        agent_id:
          type: string
          format: uuid
        repo_connector_id:
          type: string
          format: uuid
        pr_number:
          type: integer
          minimum: 1
    TriggerConfig:
      oneOf:
      - $ref: '#/components/schemas/ListJoinedTriggerConfig'
      - $ref: '#/components/schemas/TagAddedTriggerConfig'
      - $ref: '#/components/schemas/EventTriggerConfig'
      discriminator:
        propertyName: type
        mapping:
          list_joined: '#/components/schemas/ListJoinedTriggerConfig'
          tag_added: '#/components/schemas/TagAddedTriggerConfig'
          event: '#/components/schemas/EventTriggerConfig'
    TriggerNode:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_-]{1,64}$
        kind:
          type: string
          enum:
          - trigger
        name:
          type: string
          maxLength: 200
        config:
          $ref: '#/components/schemas/TriggerConfig'
      required:
      - id
      - kind
      - config
    TriggerRunRequest:
      type: object
      description: Optional run trigger. An empty body defaults to a manual trigger.
      properties:
        trigger:
          type: string
          enum:
          - manual
          - event
          default: manual
        target_type:
          type: string
          enum:
          - ticket
          - null
          nullable: true
        target_id:
          type: string
          format: uuid
          nullable: true
    UntilWaitConfig:
      type: object
      additionalProperties: false
      required:
      - mode
      - time
      properties:
        mode:
          type: string
          enum:
          - until
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          nullable: true
          format: int32
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        timezone:
          type: string
          description: IANA timezone; absent or empty uses UTC.
    UpdateAICredentialRequest:
      type: object
      description: Partial config-only update — omit a field to leave it unchanged. base_url, allow_private_base_url,
        api_key, and provider are immutable (delete+recreate). Omitted or null fields are preserved, not cleared.
        Explicit false, zero and empty replacement arrays are passed through where applicable.
      properties:
        default_model:
          type: string
          minLength: 1
          nullable: true
        max_concurrent_lanes:
          type: integer
          description: Zero uses 4; other values are clamped into [1,16] rather than rejected.
          nullable: true
          format: int64
    UpdateAgentRequest:
      type: object
      description: Partial update — omit a field to leave it unchanged. provider is immutable. Omitted or null fields
        are preserved, not cleared. Explicit false, zero and empty replacement arrays are passed through where applicable.
      properties:
        name:
          type: string
          minLength: 1
          nullable: true
        model:
          type: string
          minLength: 1
          nullable: true
        system_prompt:
          type: string
          nullable: true
        allowed_tools:
          type: array
          items:
            type: string
          nullable: true
        web_allowed_domains:
          type: array
          items:
            type: string
          description: Opt-in domain allowlist scoping the OpenRouter web_fetch server tool. Empty (default) means
            web fetching is not enabled for the agent.
          nullable: true
        autonomy_mode:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - null
          format: int32
          nullable: true
        enabled:
          type: boolean
          nullable: true
        monthly_budget_cents:
          type: integer
          minimum: 0
          maximum: 2147483647
          format: int32
          nullable: true
        retriage_on_reply:
          type: boolean
          description: When true, a customer reply on an existing ticket re-invokes this agent (bounded by a per-ticket
            hourly cap). Default false.
          nullable: true
        allowed_mcp_servers:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
    UpdateCompany:
      type: object
      description: Set-or-preserve update. Null or omitted fields preserve their existing values. Empty or whitespace-only
        name also preserves. A supplied domain string, including empty, replaces the domain; null does not clear.
      properties:
        name:
          type: string
          nullable: true
          description: Omitted, null, empty, or whitespace-only preserves. Otherwise trimmed and replaced.
        domain:
          type: string
          nullable: true
          description: Omitted or null preserves; a supplied string replaces, including empty.
    UpdateConnector:
      type: object
      description: Partial update. Omitted or null fields are preserved; an empty config object replaces configuration.
        base_url and type are immutable.
      properties:
        display_name:
          type: string
          nullable: true
          minLength: 1
        config:
          type: object
          additionalProperties: true
          nullable: true
        status:
          type: string
          enum:
          - enabled
          - disabled
          - null
          nullable: true
        suppress_native_notifications:
          type: boolean
          description: Omitted = preserved.
          nullable: true
    UpdateContact:
      type: object
      description: Set-or-preserve update. Omitted or null display_name/company_id preserves its existing value;
        null never clears. Empty display_name sets an empty string. Empty or whitespace-only company_id preserves.
        Non-empty company_id must be a UUID. primary_email is immutable.
      properties:
        display_name:
          type: string
          nullable: true
          description: Omitted or null preserves; a supplied string, including empty, replaces.
        company_id:
          type: string
          format: uuid
          nullable: true
          description: Omitted, null, empty or whitespace-only preserves; a non-empty UUID sets the association.
            Cannot clear.
    UpdateMCPServerRequest:
      type: object
      description: Partial update — omit a field to leave it unchanged. Omitted or null fields are preserved, not
        cleared. Explicit false, zero and empty replacement arrays are passed through where applicable.
      properties:
        name:
          type: string
          minLength: 1
          nullable: true
          pattern: ^[^:]+$
        url:
          type: string
          format: uri
          nullable: true
        auth_token:
          type: string
          writeOnly: true
          description: 'Replace the sealed bearer token. Empty string clears auth. Write-only — never returned in
            any response.

            '
          nullable: true
        enabled:
          type: boolean
          nullable: true
    ValidNode:
      oneOf:
      - $ref: '#/components/schemas/TriggerNode'
      - $ref: '#/components/schemas/SendEmailNode'
      - $ref: '#/components/schemas/WaitNode'
      - $ref: '#/components/schemas/ConditionNode'
      - $ref: '#/components/schemas/AddTagNode'
      - $ref: '#/components/schemas/RemoveTagNode'
      - $ref: '#/components/schemas/ExitNode'
