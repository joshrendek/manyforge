                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Per-IP or per-key rate limit exceeded; no automatic retry is implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected HTTP response, including a non-JSON proxy or transport error. Preserve status,
            headers, request ID and bounded raw body; do not infer the Error envelope.
      x-manyforge-signing: feedback
      x-manyforge-audience: public
      x-manyforge-resource: posts
      x-manyforge-method: list
