          type: string
          description: RFC822 Message-ID; basis of idempotent threading (FR-004/FR-005)
          nullable: true
        in_reply_to:
          type: string
          description: RFC822 In-Reply-To header
          nullable: true
        references:
          type: array
          items:
            type: string
          description: RFC822 References chain
        author_principal_id:
          type: string
          format: uuid
          description: member who authored an outbound reply or note; null for inbound
          nullable: true
        body_text:
          type: string
          nullable: true
        body_html:
          type: string
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        spf_result:
          $ref: '#/components/schemas/DnsRecordState'
        dkim_result:
          $ref: '#/components/schemas/DnsRecordState'
        dmarc_result:
          $ref: '#/components/schemas/DnsRecordState'
        delivery_state:
          type: string
          enum:
          - pending
          - sent
          - failed
          - null
          description: outbound delivery lifecycle; null for inbound/note
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - ticket_id
      - direction
      - message_id
      - in_reply_to
      - references
      - author_principal_id
      - body_text
      - body_html
      - attachments
      - spf_result
      - dkim_result
      - dmarc_result
      - delivery_state
      - created_at
    TicketMessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    TicketPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        next_cursor:
          type: string
          nullable: true
      required:
      - items
      - next_cursor
    TicketPriority:
      type: string
      enum:
      - low
      - normal
      - high
      - urgent
    TicketStatus:
      type: string
      enum:
      - new
      - open
      - pending
      - solved
      - closed
      description: ticket lifecycle (FR-010); an inbound reply on solved/closed reopens to open.
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
      required:
      - access_token
      - refresh_token
      - expires_in
