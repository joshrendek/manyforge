{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "manyforge.fullname" . }}
  labels:
    {{- include "manyforge.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if or .Values.analytics.trustCloudflareCountryHeader .Values.analytics.cloudflareSourceRanges }}
    # Keep Cloudflare origin isolation independent of runtime country trust. During a true→false
    # rollout, old pods retain the old environment until they terminate.
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ required "manyforge: analytics.cloudflareSourceRanges is required when trusting CF-IPCountry" .Values.analytics.cloudflareSourceRanges | quote }}
    {{- end }}
    {{- if .Values.ingress.denyMetrics }}
    # /metrics (Go expvar) is otherwise reachable via the `/` catch-all route
    # below; deny it at the ingress. Requires the cluster's ingress-nginx to
    # run with `allowSnippetAnnotations: true`.
    nginx.ingress.kubernetes.io/server-snippet: |
      location /metrics { deny all; return 403; }
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- /* Extra hostnames are extra rules on this same Ingress so the annotations above apply to every host. */}}
    {{- /* Without an instance host the app turns host routing off and would serve every route on these hostnames. */}}
    {{- if and .Values.ingress.extraHosts (not (regexMatch "^https?://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/.*)?$" (lower (toString .Values.publicBaseURL)))) }}
    {{- fail "manyforge: ingress.extraHosts requires publicBaseURL to be an http(s) URL with a host (for example https://app.example.test); without it host routing is off" }}
    {{- end }}
    {{- $seen := list (lower .Values.ingress.host) }}
    {{- $hosts := list .Values.ingress.host }}
    {{- range .Values.ingress.extraHosts }}
    {{- $h := lower (toString .) }}
    {{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $h) }}
    {{- fail (printf "manyforge: ingress.extraHosts entry %q is not a plain hostname (letters, digits and hyphens in two or more dot-separated labels; no wildcard, port, scheme or path)" (toString .)) }}
    {{- end }}
    {{- if has $h $seen }}
    {{- fail (printf "manyforge: ingress.extraHosts entry %q duplicates ingress.host or another entry" (toString .)) }}
    {{- end }}
    {{- $seen = append $seen $h }}
    {{- $hosts = append $hosts $h }}
    {{- end }}
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "manyforge.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
