{{- if and .Values.analytics.trustCloudflareCountryHeader (not .Values.ingress.enabled) }}
{{- fail "manyforge: ingress.enabled must be true when trusting CF-IPCountry" }}
{{- end }}
{{- $sourceRangeCount := 0 }}
{{- range $raw := splitList "," (toString .Values.analytics.cloudflareSourceRanges) }}
{{- $cidr := lower (trim $raw) }}
{{- if $cidr }}
{{- $sourceRangeCount = add1 $sourceRangeCount }}
{{- if gt $sourceRangeCount 64 }}
{{- fail "manyforge: analytics.cloudflareSourceRanges must contain at most 64 source ranges" }}
{{- end }}
{{- $parts := splitList "/" $cidr }}
{{- $mappedIPv4 := regexMatch "^(::ffff:|0+:0+:0+:0+:0+:ffff:).*" $cidr }}
{{- if $mappedIPv4 }}
{{- fail (printf "manyforge: analytics.cloudflareSourceRanges must use native IPv4 CIDRs instead of IPv4-mapped range (%s)" $raw) }}
{{- end }}
{{- if ne (len $parts) 2 }}
{{- fail (printf "manyforge: analytics.cloudflareSourceRanges contains a malformed source range (%s)" $raw) }}
{{- end }}
{{- $prefix := atoi (index $parts 1) }}
{{- if or (and (contains ":" $cidr) (lt $prefix 16)) (and (not (contains ":" $cidr)) (lt $prefix 8)) }}
{{- fail (printf "manyforge: analytics.cloudflareSourceRanges contains an excessively broad source range (%s)" $raw) }}
{{- end }}
{{- end }}
{{- end }}
{{- if or .Values.analytics.trustCloudflareCountryHeader .Values.analytics.trustedIngressNamespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "manyforge.fullname" . }}-trusted-ingress
  labels:
    {{- include "manyforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "manyforge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "manyforge: analytics.trustedIngressNamespace is required when trusting CF-IPCountry" .Values.analytics.trustedIngressNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: http
{{- end }}
