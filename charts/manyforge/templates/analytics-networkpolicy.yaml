{{- if and .Values.analytics.trustCloudflareCountryHeader (not .Values.ingress.enabled) }}
{{- fail "manyforge: ingress.enabled must be true when trusting CF-IPCountry" }}
{{- end }}
{{- if .Values.analytics.trustCloudflareCountryHeader }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "manyforge.fullname" . }}-trusted-ingress
  labels:
    {{- include "manyforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "manyforge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "manyforge: analytics.trustedIngressNamespace is required when trusting CF-IPCountry" .Values.analytics.trustedIngressNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: http
{{- end }}
