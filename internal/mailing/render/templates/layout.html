<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Email from {{.FromName}}</title>
  <style>
    body { margin: 0; }
    .shell { width: 100%; padding: 28px 12px; }
    .card { max-width: 640px; margin: 0 auto; border: 1px solid #dfe5ea; border-radius: 12px; overflow: hidden; }
    .brand { padding: 20px 28px; border-bottom: 1px solid #e8edf1; font-weight: 700; }
    .preheader { display: none !important; max-height: 0; overflow: hidden; opacity: 0; color: transparent; }
    .content { padding: 28px; }
    .content img { max-width: 100%; height: auto; }
    .content a { color: {{.Brand.Colors.Accent}}; }
    .footer { max-width: 640px; margin: 16px auto 0; color: #667480; font-size: 13px; text-align: center; }
    .footer a { color: #52616d; }
    .footer-custom { margin-bottom: 12px; }
    .footer-custom a { color: {{.Brand.Colors.Accent}}; }
  </style>
</head>
<body bgcolor="{{.Brand.Colors.Background}}" style="margin:0;background:{{.Brand.Colors.Background}};color:{{.Brand.Colors.Text}};font:16px/1.55 {{.FontStack}}">
  <span class="preheader" aria-hidden="true">{{.Preheader}}</span>
  <main class="shell" role="main">
    <div class="card" style="background:{{.Brand.Colors.Surface}};font-family:{{.FontStack}}">
      <div class="brand" style="background:{{.Brand.Colors.HeaderBackground}};color:{{.Brand.Colors.HeaderText}}">{{if .Brand.LogoURL}}<img src="{{.Brand.LogoURL}}" width="{{.Brand.LogoWidth}}" alt="{{.Brand.Name}}" style="display:block;border:0;max-width:100%;height:auto">{{else}}{{.Brand.Name}}{{end}}</div>
      <div class="content">{{.Body}}</div>
    </div>
    <footer class="footer" role="contentinfo">
      {{if .FooterHTML}}<div class="footer-custom">{{.FooterHTML}}</div>{{end}}
      {{if .PostalAddress}}<div>{{.PostalAddress}}</div>{{end}}
      <div><a href="{{.UnsubscribeMarker}}">Unsubscribe from {{.FromName}} emails</a></div>
    </footer>
  </main>
</body>
</html>
