name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: azure/setup-helm@v4
      - name: Helm chart
        run: |
          set -euo pipefail
          common=(--set jwt.activeKid=k1 --set trustedProxyCidr=10.244.0.0/16)
          helm lint charts/manyforge "${common[@]}"
          default_render="$(helm template manyforge charts/manyforge "${common[@]}")"
          grep -Fq 'MANYFORGE_TRUST_CF_IPCOUNTRY: "false"' <<<"$default_render"
          grep -Fq 'MANYFORGE_CF_SOURCE_CIDR: ""' <<<"$default_render"
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.trustedIngressNamespace=ingress >/dev/null 2>&1; then
            echo "trusted country mode rendered without Cloudflare source ranges" >&2
            exit 1
          fi
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 >/dev/null 2>&1; then
            echo "trusted country mode rendered without a trusted ingress namespace" >&2
            exit 1
          fi
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=false \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 >/dev/null 2>&1; then
            echo "retained Cloudflare source ranges rendered without origin isolation" >&2
            exit 1
          fi
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set ingress.enabled=false \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 \
            --set-string analytics.trustedIngressNamespace=ingress >/dev/null 2>&1; then
            echo "trusted country mode rendered without chart-managed ingress" >&2
            exit 1
          fi
          for unsafe_range in \
            '0.0.0.0/0' \
            '::/0' \
            '::ffff:0:0/96' \
            '0.0.0.0/1\,128.0.0.0/1' \
            '::/1\,8000::/1'; do
            if helm template manyforge charts/manyforge "${common[@]}" \
              --set analytics.trustCloudflareCountryHeader=true \
              --set-string analytics.cloudflareSourceRanges="$unsafe_range" \
              --set-string analytics.trustedIngressNamespace=ingress >/dev/null 2>&1; then
              echo "trusted country mode rendered with universal source range $unsafe_range" >&2
              exit 1
            fi
          done
          for invalid_range in \
            'not-an-ip/8' \
            '203.0.113.0/33' \
            '203.0.113.0/not-a-prefix' \
            '10.0.0.0/7' \
            '2001:db8::/129' \
            '2001:db8::/15' \
            '2001:::1/32' \
            ':1:2:3:4:5:6:7:8/64' \
            '1:2:3:4:5:6:7:8:/64'; do
            if helm template manyforge charts/manyforge "${common[@]}" \
              --set analytics.trustCloudflareCountryHeader=true \
              --set-string analytics.cloudflareSourceRanges="$invalid_range" \
              --set-string analytics.trustedIngressNamespace=ingress >/dev/null 2>&1; then
              echo "trusted country mode rendered with invalid source range $invalid_range" >&2
              exit 1
            fi
          done
          too_many_ranges="203.0.113.0/24"
          for ((i=1; i<65; i++)); do
            too_many_ranges+='\,'"203.0.113.0/24"
          done
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges="$too_many_ranges" \
            --set-string analytics.trustedIngressNamespace=ingress >/dev/null 2>&1; then
            echo "trusted country mode rendered with more than 64 source ranges" >&2
            exit 1
          fi
          enabled_render="$(helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 \
            --set-string analytics.trustedIngressNamespace=ingress \
            --set service.port=80)"
          grep -Fq 'MANYFORGE_TRUST_CF_IPCOUNTRY: "true"' <<<"$enabled_render"
          grep -Fq 'MANYFORGE_CF_SOURCE_CIDR: "203.0.113.0/24"' <<<"$enabled_render"
          grep -Fq 'nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"' \
            <<<"$enabled_render"
          grep -Fq 'name: manyforge-trusted-ingress' <<<"$enabled_render"
          grep -Fq 'kubernetes.io/metadata.name: "ingress"' <<<"$enabled_render"
          grep -Fq '          port: http' <<<"$enabled_render"
          ipv6_render="$(helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges=2400:cb00::/32 \
            --set-string analytics.trustedIngressNamespace=ingress)"
          grep -Fq 'MANYFORGE_CF_SOURCE_CIDR: "2400:cb00::/32"' <<<"$ipv6_render"
          grep -Fq 'nginx.ingress.kubernetes.io/whitelist-source-range: "2400:cb00::/32"' \
            <<<"$ipv6_render"
          isolated_disabled_render="$(helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=false \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 \
            --set-string analytics.trustedIngressNamespace=ingress)"
          grep -Fq 'MANYFORGE_TRUST_CF_IPCOUNTRY: "false"' <<<"$isolated_disabled_render"
          grep -Fq 'nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"' \
            <<<"$isolated_disabled_render"
          grep -Fq 'name: manyforge-trusted-ingress' <<<"$isolated_disabled_render"
          default_checksum="$(awk 'index($0, "checksum/config:") { print $2; exit }' <<<"$default_render")"
          enabled_checksum="$(awk 'index($0, "checksum/config:") { print $2; exit }' <<<"$enabled_render")"
          test -n "$default_checksum"
          test -n "$enabled_checksum"
          test "$default_checksum" != "$enabled_checksum"
      - name: Build
        run: make build
      - name: Vet / lint
        run: make lint
      - name: Test
        run: make test
      - name: Contract tests (shared-layer interfaces + OpenAPI drift)
        run: make contract-test
      - name: Integration tests (testcontainers)
        run: make int-test

  # manyforge-m07j. The frontend suite existed long before this job did — 371 unit tests and 130
  # e2e tests that only ever ran when someone ran them by hand. A PR could go green with a broken
  # component, and one did: an undefined CSS token shipped to master because nothing checked.
  #
  # Separate job, not extra steps on build-test: it needs Node rather than Go, and keeping it
  # parallel means the Go feedback loop does not get slower.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Design tokens
        run: npm run check:tokens
      # No Prettier gate yet, deliberately. A .prettierrc exists but was never enforced: 80 files
      # under src/ do not conform, and styles.css is written in a compact single-line-per-rule style
      # that Prettier would explode into ~500 changed lines. Turning the check on means either a
      # repo-wide reformat or overriding that style — a decision of its own, tracked separately,
      # not something to smuggle in with the job that makes the tests run.
      - name: Unit tests
        run: npx ng test --watch=false
      # Cache the browser download; it is the slowest part of this job by far.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        # The suite starts its own dev server (see playwright.config.ts) and every spec intercepts
        # **/api/**, so no backend is needed.
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # Keep these jobs unfiltered: backend-only changes can break the installed SDKs.
  sdk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          overwrite-settings: false
      - name: Install frozen SDK tooling
        run: uv sync --frozen --project tools/sdk --python 3.11
      - name: Resolve comparison merge-base
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test "$BASE_SHA" != "0000000000000000000000000000000000000000"
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$base"
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Canonical schema, pinned generation, file manifest and four-language parity
        # generate.py verifies the toolchain.json JAR SHA-256 before execution.
        # Compiler-derived snapshot verification runs independently in sdk-pack.
        run: tools/sdk/.venv/bin/python tools/sdk/generate.py --check
      - name: SDK contract and synchronization regression checks
        run: tools/sdk/.venv/bin/python -m unittest discover -s tools/sdk -p 'test_*.py'
      - name: All-enabled routes and canonical wire assertions
        run: go test -tags contract -count=1 -timeout 120s ./cmd/manyforge ./internal/security_regression
      - name: Wire, operation metadata and committed public-surface compatibility
        env:
          SDK_BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: tools/sdk/.venv/bin/python tools/sdk/compatibility.py --base-ref "$SDK_BASE_REF"
      - name: SDK release signal and verified bot-only exemption
        env:
          SDK_BASE_REF: ${{ steps.baseline.outputs.ref }}
          SDK_RELEASE_APP_SLUG: ${{ vars.SDK_RELEASE_APP_SLUG }}
          SDK_RELEASE_APP_ID: ${{ vars.SDK_RELEASE_APP_ID }}
        run: tools/sdk/.venv/bin/python tools/sdk/release_signal.py --event "$GITHUB_EVENT_PATH" --base-ref "$SDK_BASE_REF"

  sdk-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            sdk/go/go.sum
            tools/sdk/modulezip/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          overwrite-settings: false
          cache: maven
      - name: Install frozen SDK tooling
        run: uv sync --frozen --project tools/sdk --python 3.11
      - name: Build all installable SDK artifacts and language behavior checks
        run: make sdk-pack
      - name: Retain exact staged artifacts for installed consumers
        uses: actions/upload-artifact@v4
        with:
          name: sdk-pack-${{ github.sha }}-${{ github.run_attempt }}
          path: sdk/dist/
          if-no-files-found: error
          retention-days: 14

  sdk-smoke:
    name: sdk-smoke (${{ matrix.language }} ${{ matrix.runtime }})
    needs: sdk-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: python, runtime: "3.11", python: "3.11", go: "1.25.5"}
          - {language: python, runtime: "3.14", python: "3.14", go: "1.25.5"}
          - {language: typescript, runtime: "22", python: "3.11", node: "22", go: "1.25.5"}
          - {language: typescript, runtime: "24", python: "3.11", node: "24", go: "1.25.5"}
          - {language: go, runtime: "1.25.5", python: "3.11", go: "1.25.5"}
          - {language: go, runtime: "1.26", python: "3.11", go: "1.26"}
          - {language: java, runtime: "17", python: "3.11", java: "17", go: "1.25.5"}
          - {language: java, runtime: "21", python: "3.11", java: "21", go: "1.25.5"}
          - {language: java, runtime: "25", python: "3.11", java: "25", go: "1.25.5"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/sdk/smoke/typescript/package-lock.json
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          overwrite-settings: false
          cache: maven
      - name: Install frozen SDK tooling on the selected runtime
        env:
          SDK_PYTHON_VERSION: ${{ matrix.python }}
        run: uv sync --frozen --project tools/sdk --python "$SDK_PYTHON_VERSION"
      - name: Prepare actual Docker database
        run: |
          set -euo pipefail
          docker info
          docker pull postgres:16
      - name: Install locked Chromium and operating-system dependencies
        if: matrix.language == 'typescript'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix tools/sdk/smoke/typescript
          node tools/sdk/smoke/typescript/node_modules/playwright/cli.js install --with-deps chromium
      - name: Download the exact packaged revision
        uses: actions/download-artifact@v4
        with:
          name: sdk-pack-${{ github.sha }}-${{ github.run_attempt }}
          path: sdk/dist/
      - name: Exercise installed SDK against an isolated real process and database
        env:
          SDK_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          mkdir -p sdk/dist/smoke
          # The fixture sanitizes server/consumer logs; never retain its credential-bearing temp tree.
          tools/sdk/.venv/bin/python tools/sdk/smoke.py \
            --language "$SDK_LANGUAGE" --artifacts sdk/dist \
            --evidence-dir sdk/dist/smoke 2>&1 | tee sdk/dist/smoke/fixture.log
      - name: Retain browser proof and sanitized fixture output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-smoke-${{ matrix.language }}-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: sdk/dist/smoke/
          if-no-files-found: warn
          retention-days: 14

  sdk-required:
    name: sdk-required
    if: ${{ always() }}
    needs: [sdk-contract, sdk-pack, sdk-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every SDK gate to succeed
        env:
          SDK_CONTRACT_RESULT: ${{ needs.sdk-contract.result }}
          SDK_PACK_RESULT: ${{ needs.sdk-pack.result }}
          SDK_SMOKE_RESULT: ${{ needs.sdk-smoke.result }}
        run: |
          set -euo pipefail
          printf 'sdk-contract=%s sdk-pack=%s sdk-smoke=%s\n' \
            "$SDK_CONTRACT_RESULT" "$SDK_PACK_RESULT" "$SDK_SMOKE_RESULT"
          test "$SDK_CONTRACT_RESULT" = success
          test "$SDK_PACK_RESULT" = success
          test "$SDK_SMOKE_RESULT" = success
