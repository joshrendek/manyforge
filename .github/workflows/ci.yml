name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: azure/setup-helm@v4
      - name: Helm chart
        run: |
          set -euo pipefail
          common=(--set jwt.activeKid=k1 --set trustedProxyCidr=10.244.0.0/16)
          helm lint charts/manyforge "${common[@]}"
          default_render="$(helm template manyforge charts/manyforge "${common[@]}")"
          grep -Fq 'MANYFORGE_TRUST_CF_IPCOUNTRY: "false"' <<<"$default_render"
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.trustedIngressNamespace=ingress >/dev/null 2>&1; then
            echo "trusted country mode rendered without Cloudflare source ranges" >&2
            exit 1
          fi
          if helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 >/dev/null 2>&1; then
            echo "trusted country mode rendered without a trusted ingress namespace" >&2
            exit 1
          fi
          enabled_render="$(helm template manyforge charts/manyforge "${common[@]}" \
            --set analytics.trustCloudflareCountryHeader=true \
            --set-string analytics.cloudflareSourceRanges=203.0.113.0/24 \
            --set-string analytics.trustedIngressNamespace=ingress \
            --set service.port=80)"
          grep -Fq 'MANYFORGE_TRUST_CF_IPCOUNTRY: "true"' <<<"$enabled_render"
          grep -Fq 'nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"' \
            <<<"$enabled_render"
          grep -Fq 'name: manyforge-trusted-ingress' <<<"$enabled_render"
          grep -Fq 'kubernetes.io/metadata.name: "ingress"' <<<"$enabled_render"
          grep -Fq '          port: http' <<<"$enabled_render"
          default_checksum="$(awk '/checksum\\/config:/ { print $2; exit }' <<<"$default_render")"
          enabled_checksum="$(awk '/checksum\\/config:/ { print $2; exit }' <<<"$enabled_render")"
          test -n "$default_checksum"
          test -n "$enabled_checksum"
          test "$default_checksum" != "$enabled_checksum"
      - name: Build
        run: make build
      - name: Vet / lint
        run: make lint
      - name: Test
        run: make test
      - name: Contract tests (shared-layer interfaces + OpenAPI drift)
        run: make contract-test
      - name: Integration tests (testcontainers)
        run: make int-test

  # manyforge-m07j. The frontend suite existed long before this job did — 371 unit tests and 130
  # e2e tests that only ever ran when someone ran them by hand. A PR could go green with a broken
  # component, and one did: an undefined CSS token shipped to master because nothing checked.
  #
  # Separate job, not extra steps on build-test: it needs Node rather than Go, and keeping it
  # parallel means the Go feedback loop does not get slower.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Design tokens
        run: npm run check:tokens
      # No Prettier gate yet, deliberately. A .prettierrc exists but was never enforced: 80 files
      # under src/ do not conform, and styles.css is written in a compact single-line-per-rule style
      # that Prettier would explode into ~500 changed lines. Turning the check on means either a
      # repo-wide reformat or overriding that style — a decision of its own, tracked separately,
      # not something to smuggle in with the job that makes the tests run.
      - name: Unit tests
        run: npx ng test --watch=false
      # Cache the browser download; it is the slowest part of this job by far.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        # The suite starts its own dev server (see playwright.config.ts) and every spec intercepts
        # **/api/**, so no backend is needed.
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
