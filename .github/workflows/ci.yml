name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private tracking history
        run: |
          if test -n "$(git log -1 --format=%H -- .beads/ issues.jsonl)"; then
            echo "Private tracking artifacts are present in this branch's history." >&2
            echo "Use the private Beads store and rebase onto sanitized history." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: make build
      - name: Vet / lint
        run: make lint
      - name: Test
        run: make test
      - name: Contract tests (shared-layer interfaces + OpenAPI drift)
        run: make contract-test
      - name: Integration tests (testcontainers)
        run: make int-test
