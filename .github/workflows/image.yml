name: images

on:
  push:
    branches: [main, master]
    # Don't build/deploy a new image for pushes that only touch bookkeeping or docs — the app image
    # is unchanged, and each build triggers a Flux rollout that restarts the app pod (which orphans
    # in-flight reviews). A push that also changes real code still builds. See manyforge-g993.
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'landing/**'
      # These contracts, packages and release controls are not app image inputs.
      # paths-ignore suppresses only all-excluded pushes; mixed backend changes still deploy.
      - 'api/**'
      - 'sdk/**'
      - 'tools/sdk/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - '.github/workflows/sdk-*.yml'
      - '.github/workflows/ci.yml'
      - '.github/CODEOWNERS'

permissions:
  contents: read

jobs:
  build-push:
    if: github.repository == 'joshrendek/manyforge' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute tag
        id: tag
        run: |
          TS=$(date +%s)
          SHA=${GITHUB_SHA::7}
          TAG=main-${SHA}-${TS}
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/joshrendek/manyforge:${{ steps.tag.outputs.TAG }}
            ghcr.io/joshrendek/manyforge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sandbox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            TARGETARCH=amd64
          tags: |
            ghcr.io/joshrendek/manyforge/opencode-sandbox:${{ steps.tag.outputs.TAG }}
            ghcr.io/joshrendek/manyforge/opencode-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push egress-proxy image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/egress-proxy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/joshrendek/manyforge/egress-proxy:${{ steps.tag.outputs.TAG }}
            ghcr.io/joshrendek/manyforge/egress-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
